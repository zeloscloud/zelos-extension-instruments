[default]
# SCPI mnemonics in their long form keep the short form in capitals (VOLTage, RESistance), a
# regex in the lint spells one as RES(ISTANCE)?, and register bits are named OV, OC, OP and OT.
extend-ignore-re = [
    "\\b[A-Z]{2,}[a-z]{2,}\\b",
    "RES\\(ISTANCE\\)\\?",
    "\\bO[VCPT]\\b",
]

[default.extend-words]
HEL = "HEL"
# A supply's series-tracking reply word.
SER = "SER"
# The IEEE 488.2 save-state command, *SAV, and its dialect forms.
SAV = "SAV"
# The SCPI short form of a generator's pulse shape.
PULS = "PULS"
# Scope mnemonics: a trigger slope (EITHer), a falling edge (NEDGe) and a byte count (BYT_Nr).
EITH = "EITH"
NED = "NED"
BYT = "BYT"

[files]
extend-exclude = ["uv.lock", "tests/transcripts/"]
