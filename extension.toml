name = "Instruments"
version = "0.1.0"
description = "Record and control bench instruments over SCPI: power supplies, electronic loads, multimeters, AC sources and oscilloscopes."
author = "Zelos"
repository = "https://github.com/zeloscloud/zelos-extension-instruments"
homepage = "https://github.com/zeloscloud/zelos-extension-instruments"
# Search matches substrings of these, the name and the description, so a word the description holds
# is wasted here. Zelos AI reads the keywords too; the page shows the first three categories.
keywords = ["power supply", "psu", "dc load", "dmm", "waveform", "test equipment", "pyvisa", "lxi", "usbtmc", "gpib", "serial", "keysight", "agilent", "rigol", "siglent", "keithley", "rohde & schwarz", "fluke", "b&k precision", "gw instek"]
categories = ["Test & Measurement", "Embedded", "Industrial"]

icon = "assets/icon.png"
readme = "README.md"

[zelos]
version = ">=26.0.9"

[config]
schema = "config.schema.json"

[host]
type = "agent"

[host.agent]
entry = "main.py"
python_version = "3.11"

# Linux and macOS: SIGTERM, then SIGKILL after this many seconds. Workers stop within one query
# timeout (2 s) and the app waits for them before it flushes; the rest is headroom for the SDK's
# atexit drain. Windows: the agent terminates the job after at most 1 s.
[host.agent.stop]
grace_seconds = 5

# The packager adds extension.toml, the readme, icon and config schema, pyproject.toml, uv.lock and
# the generated actions.json; everything else is named here.
[package]
paths = ["main.py", "zelos_extension_instruments", "profiles", "docs", "LICENSE", "assets/readme"]
