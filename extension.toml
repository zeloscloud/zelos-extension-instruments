name = "Instruments"
version = "0.3.0"
description = "Record and control bench instruments over SCPI on LAN, USB-TMC, serial or VISA: power supplies, electronic loads, multimeters, AC sources, oscilloscopes, function generators and data acquisition units."
author = "Zelos"
repository = "https://github.com/zeloscloud/zelos-extension-instruments"
# At most 20 keywords and 10 categories. Marketplace search matches both, the name, description,
# author and repository. Zelos AI sees the name, description and keywords, not the categories.
keywords = ["power supply", "psu", "dc load", "dmm", "waveform", "test equipment", "pyvisa", "lxi", "usbtmc", "gpib", "awg", "daq", "keysight", "agilent", "rigol", "siglent", "keithley", "rohde & schwarz", "fluke", "tektronix"]
categories = ["Test & Measurement", "Embedded", "Industrial"]
icon = "assets/icon.png"
readme = "README.md"

[zelos]
version = ">=26.0.10"

[config]
schema = "config.schema.json"

[agent]
runtime = "python"
entry = "main.py"
python_version = "3.11"

# Workers stop within one 2 s query timeout; the rest is headroom for the SDK's atexit drain.
[agent.stop]
grace_seconds = 5

[package]
paths = ["LICENSE", "main.py", "zelos_extension_instruments", "profiles", "docs", "assets/readme"]
