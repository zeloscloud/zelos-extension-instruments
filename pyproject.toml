[project]
name = "zelos-extension-instruments"
version = "0.2.0"
description = "Record and control bench instruments over SCPI on LAN, USB-TMC, serial or VISA: power supplies, electronic loads, multimeters, AC sources, oscilloscopes, function generators and data acquisition units."
authors = [{ name = "Zelos", email = "support@zeloscloud.io" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["zelos", "extension", "scpi", "visa", "instruments"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "zelos-sdk>=0.0.13a1",
    "pyvisa>=1.14",
    # Exact: USB-TMC behavior changes between releases, and every bump is re-tested on the bench.
    "pyvisa-py==0.8.1",
    "pyusb>=1.2",
    "libusb-package>=1.0.26",
    "serialx>=1.11",
    "zeroconf>=0.130",
    "psutil>=5.9",
    "jsonschema>=4",
    "numpy>=1.26",
    "pyarrow>=18",
]

[project.urls]
Homepage = "https://github.com/zeloscloud/zelos-extension-instruments"
Repository = "https://github.com/zeloscloud/zelos-extension-instruments"
Issues = "https://github.com/zeloscloud/zelos-extension-instruments/issues"
Documentation = "https://docs.zeloscloud.io/app/extensions/"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
    "hypothesis>=6",
    "pyright>=1.1.400",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.9.5"

[tool.hatch.build.targets.wheel]
packages = ["zelos_extension_instruments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "--log-cli-level=INFO -m 'not perf and not hardware'"
markers = [
    "perf: cadence and soak gates; run with -m perf",
    "hardware: needs real instruments; run with -m hardware on the bench",
]

[tool.ruff]
target-version = 'py311'
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "B008",   # function call in defaults (common in decorators)
]

[tool.pyright]
include = ["main.py", "zelos_extension_instruments", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
