schema = 1
id = "owon-xdm"
name = "OWON XDM2041"
category = "dmm"
notes = """Transcribed from the XDM2041 Digital Multimeter Programming Manual; never run on a unit. Only the XDM2041 is covered. The XDM1041 and XDM1241 programming manual could not be downloaded, so they need their own profile. The manual says the SCPI protocol runs over USB or LAN and gives no LAN port, baud rate or serial settings. Two real XDM2041 setups talk at 115200 baud, so the profile uses it; set the others in the config. An XDM1241 capture shows the meter silent for about 2.8 s after CONF:TEMP:RTD, longer than the default 2 s timeout, after which every reply arrived one query late. The same capture shows MEAS1? returning the previous function's digits with the new range's exponent for 0.5 s to 1.5 s after any CONF command. Neither was measured on an XDM2041. The manual documents no error-queue query, so this profile has no error query and sets are verified by readback only. The manual says SYST:REM enters SCPI mode and SYST:LOC exits it, so the profile sends SYST:REM after connect. MEAS1? returns the main display value; MEAS? returns two comma-separated values when the secondary display is on, so this profile uses MEAS1?. The manual says FUNC? returns the abbreviated function in quotes and lists the strings in a table as VOLT AC, VOLT, CURR AC, CURR, FREQ, PER, CAP, CONT, DIOD, FRES, RES and TEMP. This profile maps those with a space, a colon or no separator. AUTO? returns 1 for autoscale and 0 for a manual range. The manual has a RANGE setter but no range query, and RATE? returns F, M or L rather than an integration time, so the range and the integration time are not read. Temperature reads in the unit set by TEMP:RTD:UNIT. CONF restores the function's measurement and trigger parameters to defaults, and the function setter selects 2-wire RTD temperature. The manual documents only *IDN and *RST as common commands, so the profile has no self-test and no operation-complete query. The beeper command only switches the beeper on or off, and the meter has no display, save, recall or lock commands. The profile has no range, auto range or integration time setter: the manual prints the SCPI range command (VOLTage:{AC|DC}:RANGe) only as an example of a value parameter and shows one auto range example for AC volts, its RANGE command takes an index whose meaning depends on the function, AUTO only switches auto range on, and the speed command RATE takes F, M or L instead of a cycle count."""

[evidence]
badge = "manual"
source = "OWON XDM2041 Digital Multimeter Programming Manual"
url = "https://files.owon.com.cn/probook/XDM2041_Digital_Multimeter_Programming_Manual.pdf"
date = "2026-10-22"

[match]
manufacturer = '(?i)^owon'
model = '^XDM2041$'

[link]
baud = 115200
remote = "SYST:REM"
local = "SYST:LOC"

[signals.value]
query = "MEAS1?"
parse = "float"

[state.autorange]
query = "AUTO?"
parse = "bool"

[state.function]
query = "FUNC?"
parse = "map"
map = { "VOLT" = "dc_voltage", "VOLT:DC" = "dc_voltage", "VOLT:AC" = "ac_voltage", "VOLTAC" = "ac_voltage", "VOLT AC" = "ac_voltage", "CURR" = "dc_current", "CURR:DC" = "dc_current", "CURR:AC" = "ac_current", "CURRAC" = "ac_current", "CURR AC" = "ac_current", "RES" = "resistance", "FRES" = "resistance_4w", "FREQ" = "frequency", "PER" = "period", "TEMP" = "temperature", "CAP" = "capacitance", "DIOD" = "diode", "CONT" = "continuity" }

[dmm]
function_query = "FUNC?"
function_map = { "VOLT" = "dc_voltage", "VOLT:DC" = "dc_voltage", "VOLT:AC" = "ac_voltage", "VOLTAC" = "ac_voltage", "VOLT AC" = "ac_voltage", "CURR" = "dc_current", "CURR:DC" = "dc_current", "CURR:AC" = "ac_current", "CURRAC" = "ac_current", "CURR AC" = "ac_current", "RES" = "resistance", "FRES" = "resistance_4w", "FREQ" = "frequency", "PER" = "period", "TEMP" = "temperature", "CAP" = "capacitance", "DIOD" = "diode", "CONT" = "continuity" }

[dmm.functions]
dc_voltage = "V"
ac_voltage = "V"
dc_current = "A"
ac_current = "A"
resistance = "Ohm"
resistance_4w = "Ohm"
frequency = "Hz"
period = "s"
temperature = "degC"
capacitance = "F"
diode = "V"
continuity = "Ohm"

[setters.function]
command = "CONF:{function}"
map = { dc_voltage = "VOLT:DC", ac_voltage = "VOLT:AC", dc_current = "CURR:DC", ac_current = "CURR:AC", resistance = "RES", resistance_4w = "FRES", frequency = "FREQ", period = "PER", temperature = "TEMP:RTD", capacitance = "CAP", diode = "DIOD", continuity = "CONT" }

[system]
self_test = false
opc = false
