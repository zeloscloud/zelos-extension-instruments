schema = 1
id = "keysight-34460a"
name = "Keysight Truevolt 34460A, 34461A, 34465A, 34470A"
category = "dmm"
notes = """Transcribed from the Truevolt programming reference; never run on a unit. The 34460A needs option 34460A-LAN or 3446LANU for LAN. The guide lists no RS-232 interface for these meters. READ? starts a new measurement each poll and returns every sample of the sample count, so leave SAMP:COUN at 1; with an external or bus trigger source it waits for the trigger and times out. FUNC? replies in the short form with quotes, such as "VOLT" for DC volts and "CURR:AC" for AC amps. Voltage ratio (VOLT:RAT) has no label here and reads as unknown. Capacitance exists on the 34465A and 34470A only; the 34460A and 34461A reject CONF:CAP. Temperature reads in the unit set by UNIT:TEMP, degrees C by default. CONF:TEMP with no argument selects the 4-wire RTD probe type (FRTD); the setter sends no argument, so it cannot select a 2-wire RTD or a thermistor. Choosing a function with CONF resets that function's range and resolution to the defaults. SYST:IDEN can make the meter answer as a 34401A or as an older Agilent model; an HP34401A identity matches the agilent-34401a profile instead."""

[evidence]
badge = "manual"
source = "Keysight Truevolt Series Digital Multimeters Operating and Service Guide, 34460-90901, Edition 5, 2017"
url = "https://www.farnell.com/datasheets/2607860.pdf"
date = "2026-10-21"

[match]
manufacturer = '(?i)^(keysight|agilent)'
model = '^344(60|61|65|70)A$'

[link]
lan_port = 5025
local = "SYST:LOC"

[errors]
query = "SYST:ERR?"

[signals.value]
query = "READ?"
parse = "float"

[state.function]
query = "FUNC?"
parse = "map"
map = { "VOLT" = "dc_voltage", "VOLT:DC" = "dc_voltage", "VOLT:AC" = "ac_voltage", "CURR" = "dc_current", "CURR:DC" = "dc_current", "CURR:AC" = "ac_current", "RES" = "resistance", "FRES" = "resistance_4w", "FREQ" = "frequency", "PER" = "period", "TEMP" = "temperature", "CAP" = "capacitance", "DIOD" = "diode", "CONT" = "continuity" }

[dmm]
function_query = "FUNC?"
function_map = { "VOLT" = "dc_voltage", "VOLT:DC" = "dc_voltage", "VOLT:AC" = "ac_voltage", "CURR" = "dc_current", "CURR:DC" = "dc_current", "CURR:AC" = "ac_current", "RES" = "resistance", "FRES" = "resistance_4w", "FREQ" = "frequency", "PER" = "period", "TEMP" = "temperature", "CAP" = "capacitance", "DIOD" = "diode", "CONT" = "continuity" }

[dmm.functions]
dc_voltage = "V"
ac_voltage = "V"
dc_current = "A"
ac_current = "A"
resistance = "Ohm"
resistance_4w = "Ohm"
frequency = "Hz"
period = "s"
temperature = "degC"
capacitance = "F"
diode = "V"
continuity = "Ohm"

[setters.function]
command = "CONF:{function}"
map = { dc_voltage = "VOLT:DC", ac_voltage = "VOLT:AC", dc_current = "CURR:DC", ac_current = "CURR:AC", resistance = "RES", resistance_4w = "FRES", frequency = "FREQ", period = "PER", temperature = "TEMP", capacitance = "CAP", diode = "DIOD", continuity = "CONT" }
