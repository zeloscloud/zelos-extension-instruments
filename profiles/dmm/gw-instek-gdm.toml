schema = 1
id = "gw-instek-gdm"
name = "GW Instek GDM-9060 and GDM-9061"
category = "dmm"
notes = """Transcribed from the GDM-9060/9061 User Manual; never run on a unit. Only the GDM-9060 and GDM-9061 are covered. No manual for the GDM-8341 or GDM-8342 could be downloaded in a readable form, so they need their own profile. \
The manual shows the *IDN? reply as GWInstek,GDM9061,..., with no hyphen in the model, and shows no GDM-9060 reply. The SCPI ID setting (SYST:SCP:MODE) can make the meter answer as a GDM-8261A or with a user-defined identity; in those modes this profile does not match, so keep it on Normal. \
LAN uses the TCP port, 3001 by default, and a Telnet port, 3000 by default; both can be changed on the meter or its web page. \
RS-232 is 115200 baud at the factory, with 8 data bits, no parity, 1 stop bit and no flow control; the manual lists 9600 to 115200 baud and RTS/CTS or DTR/DSR flow control as options. Replies over RS-232 end with the EOL character set in the TX TERM menu, CR+LF by default; USBTMC, GPIB and LAN replies end with LF. \
SYST:LOC, SYST:REM and SYST:RWLock are listed as RS-232 commands, so the profile sends SYST:LOC for the Local action only; the manual does not state its effect over LAN or USB. \
READ? returns the first display value and no unit. It is like INITiate followed by FETCh?, and it places the meter in the wait-for-trigger state, so with an external or bus trigger source the reading follows the trigger. With the secondary display on, VAL? returns both values, which this profile does not read. \
The meter has a secondary display and a second function; this profile reads and sets the first display only, so the function query is FUNC1? (the manual's FUNCtion[X] with X = 1). \
The function query answers TEMP for every temperature probe. \
Temperature reads in the unit set by SENS:UNIT (C, F or K), so the temperature reading carries no unit label. \
CONF takes an optional range and resolution, and this profile sends neither. CONF:TEMP is sent without a probe type, which the manual does not describe. \
Range, autorange and NPLC are read and set per function (for example SENS:VOLT:DC:RANG?), so the profile reads none of them. The range and auto range setters act on the current function, and each reads its own value back with the function's query; the meter picks the range that covers the value. They cover DC and AC volts, DC and AC amps, 2-wire and 4-wire resistance and capacitance; frequency and period have a voltage and a current range of their own, so the setters refuse them. The integration time setter covers DC volts, DC amps and 2-wire and 4-wire resistance, with 0.006, 0.0083, 0.0125, 0.025, 0.05, 0.15, 0.6, 1, 3 or 12 cycles. Temperature (1, 3 or 12 cycles), diode and continuity (0.15, 0.6 or 1 cycle) take shorter lists, so their setters are refused. The meter has no *TST? command. Save takes memory 1 to 5, and recall takes the same; *RCL 0 loads the factory defaults and is not offered. The manual states no length limit for the display text, so the profile has no display text action. Lock sends SYSTem:RWLock and unlock sends SYSTem:LOCal, both listed as RS-232 commands."""

[evidence]
badge = "manual"
source = "GW Instek GDM-9060/9061 Dual Measurement Multimeter User Manual, 82DM-90610E01"
url = "https://www.gmciuk.com/manuals/gw-instek-gdm-9061_manual_762347.pdf"
date = "2026-10-22"

[match]
manufacturer = '(?i)^gw\s*-?\s*instek'
model = '(?i)^GDM-?906[01]$'

[link]
lan_port = 3001
baud = 115200
local = "SYST:LOC"

[errors]
query = "SYST:ERR?"

[ranges]
nplc = { choices = [0.006, 0.0083, 0.0125, 0.025, 0.05, 0.15, 0.6, 1, 3, 12], digits = 4 }

[signals.value]
query = "READ?"
parse = "float"

[state.function]
query = "FUNC1?"
parse = "map"
map = { "VOLT" = "dc_voltage", "VOLT:DC" = "dc_voltage", "VOLT:AC" = "ac_voltage", "CURR" = "dc_current", "CURR:DC" = "dc_current", "CURR:AC" = "ac_current", "RES" = "resistance", "FRES" = "resistance_4w", "FREQ" = "frequency", "PER" = "period", "TEMP" = "temperature", "TEMP:TCO" = "temperature", "TEMP:RTD" = "temperature", "TEMP:FRTD" = "temperature", "CAP" = "capacitance", "DIOD" = "diode", "CONT" = "continuity" }

[dmm]
function_query = "FUNC1?"
function_map = { "VOLT" = "dc_voltage", "VOLT:DC" = "dc_voltage", "VOLT:AC" = "ac_voltage", "CURR" = "dc_current", "CURR:DC" = "dc_current", "CURR:AC" = "ac_current", "RES" = "resistance", "FRES" = "resistance_4w", "FREQ" = "frequency", "PER" = "period", "TEMP" = "temperature", "TEMP:TCO" = "temperature", "TEMP:RTD" = "temperature", "TEMP:FRTD" = "temperature", "CAP" = "capacitance", "DIOD" = "diode", "CONT" = "continuity" }

[dmm.functions]
dc_voltage = "V"
ac_voltage = "V"
dc_current = "A"
ac_current = "A"
resistance = "Ohm"
resistance_4w = "Ohm"
frequency = "Hz"
period = "s"
temperature = ""
capacitance = "F"
diode = "V"
continuity = "Ohm"

[setters.function]
command = "CONF:{function}"
map = { dc_voltage = "VOLT:DC", ac_voltage = "VOLT:AC", dc_current = "CURR:DC", ac_current = "CURR:AC", resistance = "RES", resistance_4w = "FRES", frequency = "FREQ", period = "PER", temperature = "TEMP", capacitance = "CAP", diode = "DIOD", continuity = "CONT" }

[setters.range]
command = "SENS:{function}:RANG {value}"
verify = "SENS:{function}:RANG?"
map = { dc_voltage = "VOLT:DC", ac_voltage = "VOLT:AC", dc_current = "CURR:DC", ac_current = "CURR:AC", resistance = "RES", resistance_4w = "FRES", capacitance = "CAP" }

[setters.autorange]
command = "SENS:{function}:RANG:AUTO {on}"
verify = "SENS:{function}:RANG:AUTO?"
map = { dc_voltage = "VOLT:DC", ac_voltage = "VOLT:AC", dc_current = "CURR:DC", ac_current = "CURR:AC", resistance = "RES", resistance_4w = "FRES", capacitance = "CAP" }

[setters.nplc]
command = "SENS:{function}:NPLC {value}"
verify = "SENS:{function}:NPLC?"
map = { dc_voltage = "VOLT:DC", dc_current = "CURR:DC", resistance = "RES", resistance_4w = "FRES" }

[system]
self_test = false
save = "*SAV {slot}"
recall = "*RCL {slot}"
slots = { min = 1, max = 5 }
beep = "SYST:BEEP:IMM"
display = "DISP {on}"
lock = "SYSTem:RWLock"
unlock = "SYSTem:LOCal"
