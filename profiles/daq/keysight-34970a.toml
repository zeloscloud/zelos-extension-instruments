schema = 1
id = "keysight-34970a"
name = "Keysight 34970A and 34972A"
category = "daq"
notes = """Transcribed from the 34970A/34972A user's guide and quick reference; never run on a unit. The 34970A has GPIB and RS-232 only, so over a network use the 34972A (LAN and USB); set the serial settings in the config for a 34970A on RS-232. The manuals name no socket port, so this profile uses 5025, the port Keysight documents for its other data acquisition units. List the scan channels and the relays in the instrument's settings (Scan and Relays). An address is the slot and the two-digit channel: 101 is channel 01 in slot 1, 315 is channel 15 in slot 3. At connect the profile sends one CONF command per function group (auto range, default resolution), then the integration times, then the scan list, and each poll sends READ?, which returns one scan of readings. CONF returns a channel's range, resolution and delay to their defaults and replaces the scan list, so settings made on the front panel for a listed channel are reset at connect. CONF also turns off the units, time, channel and alarm fields, so READ? returns plain readings. Integration time takes 0.02, 0.2, 1, 2, 10, 20, 100 or 200 power line cycles and applies to DC voltage, DC current, resistance, 4-wire resistance and temperature. Thermocouples use the module's internal reference junction, the factory default. Temperatures are recorded as degC, the default unit; a channel set to F or K would read in that unit. Modules considered: the 34901A, 34902A and 34908A multiplexers for scanning, and the 34903A actuator, 34904A matrix and 34905A/34906A RF multiplexers for relays. DC and AC current work only on channels 21 and 22 of the 34901A. List only the source channel of a 4-wire measurement: the instrument pairs channel n with n+10 on the 34901A and n+8 on the 34902A. The 34907A multifunction module (digital I/O, totalizer, DAC) is not covered. A multiplexer channel cannot be closed or opened by itself once any channel on its module is in the scan list, so keep relay channels on modules that carry no scan channels. On the 34905A and 34906A, closing a channel opens the other channel in its bank, and OPEN does not apply. The reply to ROUT:CLOSE? is read as 0 or 1; these manuals do not print it, the DAQ970A guide does. The display text takes 13 characters, and it replaces the readings on the display until cleared. Save and recall offer slots 1 to 5, because slot 0 holds the power-down state and is overwritten at power-up, and recall works only on a slot that holds a stored state. The poll timeout is 30 s. The 34901A switches up to 60 channels per second and 1 PLC takes 20 ms on 50 Hz mains, so that leaves wide room for a scan of 120 channels. Raise it in the config for long integration times or AC measurements, where the guide gives settling times up to 7 s per channel. The full self-test takes about 20 seconds. There is no beep command, and Lock and Local are left out: the guide allows SYST:RWL, SYST:REM and SYST:LOC on the 34970A only over RS-232 and does not say whether the 34972A takes them. The guide reports an error for READ? while the instrument is in local mode."""

[evidence]
badge = "manual"
source = "Keysight 34970A/34972A Data Acquisition/Switch Unit User's Guide, 34972-90001 (9018-02644); 34970A Quick Reference Guide, 34970-90009 (SCPI command summary, http://keysight.com/upload/cmc_upload/All/34970-90009_quick_ref.pdf)"
url = "https://www.keysight.com/us/en/assets/9018-02644/user-manuals/9018-02644.pdf"
date = "2026-10-22"

[match]
manufacturer = '(?i)^(keysight|agilent|hewlett)'
model = '^349(70|72)A$'

[link]
lan_port = 5025
timeout_s = 30

[errors]
query = "SYST:ERR?"

[system]
save = "*SAV {slot}"
recall = "*RCL {slot}"
slots = { min = 1, max = 5 }
display = "DISP {on}"
display_text = 'DISP:TEXT "{text}"'
display_text_max = 13
display_clear = "DISP:TEXT:CLE"

[daq]
scan = "ROUT:SCAN (@{channels})"
read = "READ?"
channel_pattern = '[1-3](0[1-9]|[1-3]\d|4[0-8])'

[daq.configure]
dc_voltage = "CONF:VOLT:DC AUTO,DEF,(@{channels})"
ac_voltage = "CONF:VOLT:AC AUTO,DEF,(@{channels})"
dc_current = "CONF:CURR:DC AUTO,DEF,(@{channels})"
ac_current = "CONF:CURR:AC AUTO,DEF,(@{channels})"
resistance = "CONF:RES AUTO,DEF,(@{channels})"
resistance_4w = "CONF:FRES AUTO,DEF,(@{channels})"
frequency = "CONF:FREQ AUTO,DEF,(@{channels})"
period = "CONF:PER AUTO,DEF,(@{channels})"
temperature = "CONF:TEMP TC,{tc},(@{channels})"

[daq.nplc]
command = "SENS:{function}:NPLC {value},(@{channels})"
map = { dc_voltage = "VOLT:DC", dc_current = "CURR:DC", resistance = "RES", resistance_4w = "FRES", temperature = "TEMP" }

[setters.relay]
command = "ROUT:CLOSE (@{ch})"
off = "ROUT:OPEN (@{ch})"
verify = "ROUT:CLOSE? (@{ch})"
