[signals.voltage]
query = "MEAS:VOLT?"
parse = "float"

[signals.current]
query = "MEAS:CURR?"
parse = "float"

[signals.power]
query = "MEAS:POW?"
parse = "float"

[state.current_set]
query = "CURR:STAT:L1?"
parse = "float"

[state.voltage_set]
query = "VOLT:STAT:L1?"
parse = "float"

[state.power_set]
query = "POW:STAT:L1?"
parse = "float"

[state.resistance_set]
query = "RES:STAT:L1?"
parse = "float"

[state.output]
query = "LOAD?"
parse = "bool"

[state.mode]
query = "MODE?"
parse = "map"
map = { CCL = "cc", CCM = "cc", CCH = "cc", CVL = "cv", CVM = "cv", CVH = "cv", CPL = "cp", CPM = "cp", CPH = "cp", CRL = "cr", CRM = "cr", CRH = "cr" }

[state.short]
query = "LOAD:SHOR?"
parse = "bool"

[state.voltage_range]
query = "CONF:VOLT:RANG?"
parse = "map"
map = { LOW = "low", MIDDLE = "mid", HIGH = "high" }

[state.slew_rise_set]
query = "CURR:STAT:RISE?"
parse = "float"

[state.slew_fall_set]
query = "CURR:STAT:FALL?"
parse = "float"

[state.protection]
flags = [
  { query = "LOAD:PROT?", parse = "bits", mask = 65539, value = "ovp" },
  { query = "LOAD:PROT?", parse = "bits", mask = 56, value = "ocp" },
  { query = "LOAD:PROT?", parse = "bits", mask = 448, value = "opp" },
  { query = "LOAD:PROT?", parse = "bits", mask = 33280, value = "otp" },
  { query = "LOAD:PROT?", parse = "bits", mask = 4, value = "other" },
]

[setters.current]
command = "CURR:STAT:L1 {value}"

[setters.voltage]
command = "VOLT:STAT:L1 {value}"

[setters.power]
command = "POW:STAT:L1 {value}"

[setters.resistance]
command = "RES:STAT:L1 {value}"

[setters.function]
command = "MODE {function}"
map = { cc = "CCH", cv = "CVH", cp = "CPH", cr = "CRH" }

[setters.output]
command = "LOAD {on}"

[setters.short]
command = "LOAD:SHOR {on}"

[setters.voltage_range]
command = "CONF:VOLT:RANG {value}"
map = { low = "LOW", mid = "MIDDLE", high = "HIGH" }

[setters.slew_rise]
command = "CURR:STAT:RISE {value}"

[setters.slew_fall]
command = "CURR:STAT:FALL {value}"

[setters.clear]
command = "LOAD:PROT:CLE"
