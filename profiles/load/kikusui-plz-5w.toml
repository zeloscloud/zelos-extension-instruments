schema = 1
id = "kikusui-plz-5w"
name = "Kikusui PLZ-5W series"
category = "load"
notes = """\
Transcribed from the PLZ-5W communication interface manual, not tried on a unit. That manual's web edition could not be reached when the profile was checked, so the command syntax was compared with the PLZ-5WH2 communication interface manual, a different series whose commands match the ones here, and the ratings and interfaces with the PLZ-5W user's manual. The series is the PLZ205W, PLZ405W and PLZ1205W. \
The constant-resistance mode is set and read in conductance (siemens) through CONDuctance, and the profile has no inverse conversion, so it has no resistance setter, no resistance setpoint and no resistance measurement. The manual has no resistance query. \
Current, voltage and power each have ranges (H, M and L for current and power, H and L for voltage). The limits in ranges are the H range, and a setpoint above the active range is rejected. \
The manual recommends remote mode before remote control: SYST:COMM:RLST REM locks the panel except the ESCAPE key. The RS-232 settings are 8 data bits and 1 stop bit, fixed, with no parity; the user's manual lists the bit rate as 9600, 19200, 38400, 57600 or 115200 in its menu and as 9600, 19200, 38400 or 115200 in its specification table, and shows no factory default. The user's manual names a SCPI-RAW LAN service without a port, and the PLZ-5WH2 manual fixes its port at 5025, which the profile keeps. \
The PLZ-5WH2 manual's identity example is KIKUSUI,PLZ1005WH2,AB123400,IFO0.53.0086 FPGA0.126.0011 IOC0.07.0062; the PLZ-5W reply form was not checked. \
The mode state reads CC, CR, CV and CP; the ARB mode reads as unknown. \
The protection state reads the questionable status condition register: weight 1 overvoltage, 2 overcurrent, 8 overpower, 16 overtemperature, and 32, 512, 1024, 2048 and 4096 for the watchdog, undervoltage, external error, reverse voltage and connection error. The Clear setter clears the protection alarms."""

[evidence]
badge = "manual"
source = "Kikusui Electronic Load PLZ-5W series Communication Interface Manual (web edition, no longer reachable); PLZ-5W User's Manual, IB027941, Mar. 2016 (ratings); PLZ-5WH2 Communication Interface Manual, IB035123, Apr 2022 (command cross-check, https://www.kikusui.cn/resources/001/pdf/plz-5wh2_interface_manual.pdf)"
url = "https://kikusui-korea.co.kr/files/PDF/PLZ_5W_M.pdf"
date = "2026-10-21"

[match]
manufacturer = '(?i)^kikusui'
model = '^PLZ(205|405|1205)W$'

[link]
remote = "SYST:COMM:RLST REM"
local = "SYST:COMM:RLST LOC"
locks_panel = true

[errors]
query = "SYST:ERR?"

[ranges]
voltage = { min = 0, max = 157.5, digits = 3 }
current = { min = 0, max = 42, digits = 3 }
power = { min = 0, max = 210, digits = 3 }

[[ranges.models]]
model = '^PLZ405W$'
current = { min = 0, max = 84, digits = 3 }
power = { min = 0, max = 420, digits = 3 }

[[ranges.models]]
model = '^PLZ1205W$'
current = { min = 0, max = 252, digits = 3 }
power = { min = 0, max = 1260, digits = 3 }

[signals.voltage]
query = "MEAS:VOLT?"
parse = "float"

[signals.current]
query = "MEAS:CURR?"
parse = "float"

[signals.power]
query = "MEAS:POW?"
parse = "float"

[state.current_set]
query = "CURR?"
parse = "float"

[state.voltage_set]
query = "VOLT?"
parse = "float"

[state.power_set]
query = "POW?"
parse = "float"

[state.output]
query = "INP?"
parse = "bool"

[state.mode]
query = "FUNC?"
parse = "map"
map = { CC = "cc", CV = "cv", CP = "cp", CR = "cr" }

[state.protection]
flags = [
  { query = "STAT:QUES:COND?", parse = "bits", mask = 1, value = "ovp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 2, shift = 1, value = "ocp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 8, shift = 3, value = "opp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 16, shift = 4, value = "otp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 7712, value = "other" },
]

[setters.current]
command = "CURR {value}"

[setters.voltage]
command = "VOLT {value}"

[setters.power]
command = "POW {value}"

[setters.function]
command = "FUNC {function}"
map = { cc = "CC", cv = "CV", cp = "CP", cr = "CR" }

[setters.output]
command = "INP {on}"

[setters.clear]
command = "INP:PROT:CLE"
