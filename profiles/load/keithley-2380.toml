schema = 1
id = "keithley-2380"
name = "Keithley 2380 series"
category = "load"
notes = """\
Transcribed from the user's manuals, not tried on a unit. The manuals have no resistance measurement query, so resistance is not read. \
MEAS:POW? starts a new power measurement. The interfaces are RS-232, USB (USBTMC) and GPIB, with no LAN port, so this extension reaches the load over RS-232 only. The manual offers 4800, 9600, 19200, 38400, 57600 and 115200 baud, with 8 data bits and no parity or 7 bits with even or odd parity, and does not name a default baud rate or flow control; match the front-panel setting (Shift + System). The manual says both that a null modem cable connects a PC and, later, to use a straight through cable and not a null modem cable; this profile follows the later statement. \
SYST:REM puts the load in remote mode and disables the front-panel keys except Shift+7 (Info), Local and Esc. \
The function query reply form is not stated; the profile accepts the short and the long word. \
A protection trip latches the input off until PROT:CLE, which the Clear setter sends once the fault is removed; the input then returns to the state it had before the fault, which may be on. The protection state reads the questionable status condition register: bit 1 overcurrent, bit 3 overpower, bit 4 overtemperature and bit 12 overvoltage. \
Each model has a low and a high current range, and the load selects the range that matches the value programmed. The current range command takes MIN for the low range and MAX for the high range; its query returns a number that depends on the model, so the range is set but not read. \
The voltage range command takes a voltage or MIN and MAX, which the manual describes as limits (0 V and a little above the rating) rather than ranges, so there is no voltage range setter. \
The slew rate is not read or set, because it is in A/uS or A/mS depending on the speed mode (CURR:SLOW:STAT) and the profile cannot tell which. \
Save and recall take 0 to 100. SYST:RWL locks the front panel including LOCAL until SYST:LOC, and the manual says it is not suitable for GPIB. \
The display text command needs DISP:MODE TEXT and a character position and has no clear command, so the profile has no display functions. The 2380J models share the commands."""

[evidence]
badge = "manual"
source = "Keithley Models 2380-500 and 2380-120 Programmable DC Electronic Load Instruments User's Manual, 2380-120-60-900-01 Rev. A, November 2015, and the 2380-500-30 User's Manual, 2380-500-30-900-01 Rev. A"
url = "https://download.tek.com/manual/2380-120-60-900-01_A_Nov_2015.pdf"
date = "2026-10-22"

[match]
manufacturer = '(?i)^keithley'
model = '^2380J?-(120-60|500-15|500-30)$'

[link]
remote = "SYST:REM"
local = "SYST:LOC"
locks_panel = true

[errors]
query = "SYST:ERR?"

[system]
save = "*SAV {slot}"
recall = "*RCL {slot}"
slots = { min = 0, max = 100 }
lock = "SYST:RWL"
unlock = "SYST:LOC"

[ranges]
voltage = { min = 0, max = 120, digits = 3 }
current = { min = 0, max = 60, digits = 4 }
power = { min = 0, max = 250, digits = 2 }
resistance = { min = 0.05, max = 7500, digits = 3 }

[[ranges.models]]
model = '^2380J?-500-15$'
voltage = { min = 0.1, max = 500, digits = 3 }
current = { min = 0, max = 15, digits = 4 }
power = { min = 0, max = 200, digits = 2 }
resistance = { min = 0.3, max = 7500, digits = 3 }

[[ranges.models]]
model = '^2380J?-500-30$'
voltage = { min = 0, max = 500, digits = 3 }
current = { min = 0, max = 30, digits = 4 }
power = { min = 0, max = 750, digits = 2 }
resistance = { min = 0.15, max = 7500, digits = 3 }

[signals.voltage]
query = "MEAS:VOLT?"
parse = "float"

[signals.current]
query = "MEAS:CURR?"
parse = "float"

[signals.power]
query = "MEAS:POW?"
parse = "float"

[state.current_set]
query = "SOUR:CURR:LEV:IMM?"
parse = "float"

[state.voltage_set]
query = "SOUR:VOLT:LEV:IMM?"
parse = "float"

[state.power_set]
query = "SOUR:POW:LEV:IMM?"
parse = "float"

[state.resistance_set]
query = "SOUR:RES:LEV:IMM?"
parse = "float"

[state.output]
query = "SOUR:INP:STAT?"
parse = "bool"

[state.mode]
query = "SOUR:FUNC?"
parse = "map"
map = { CURR = "cc", CURRENT = "cc", VOLT = "cv", VOLTAGE = "cv", POW = "cp", POWER = "cp", RES = "cr", RESISTANCE = "cr" }

[state.short]
query = "SOUR:INP:SHOR:STAT?"
parse = "bool"

[state.protection]
flags = [
  { query = "STAT:QUES:COND?", parse = "bits", mask = 4096, shift = 12, value = "ovp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 2, shift = 1, value = "ocp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 8, shift = 3, value = "opp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 16, shift = 4, value = "otp" },
]

[setters.current]
command = "SOUR:CURR:LEV:IMM {value}"

[setters.voltage]
command = "SOUR:VOLT:LEV:IMM {value}"

[setters.power]
command = "SOUR:POW:LEV:IMM {value}"

[setters.resistance]
command = "SOUR:RES:LEV:IMM {value}"

[setters.function]
command = "SOUR:FUNC {function}"
map = { cc = "CURR", cv = "VOLT", cp = "POW", cr = "RES" }

[setters.output]
command = "SOUR:INP:STAT {on}"

[setters.short]
command = "SOUR:INP:SHOR {on}"

[setters.current_range]
command = "SOUR:CURR:RANG {value}"
map = { low = "MIN", high = "MAX" }

[setters.clear]
command = "SOUR:PROT:CLE"
