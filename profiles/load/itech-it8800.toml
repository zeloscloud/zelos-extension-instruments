schema = 1
id = "itech-it8800"
name = "ITECH IT8800 series"
category = "load"
notes = """\
Transcribed from the programming guide, not tried on a unit. The guide covers the IT8811, IT8812, IT8812B, IT8812C and about forty more IT8800 models, and the profile matches all of them. Ratings are known for the IT8811, IT8812, IT8812B and IT8812C only, from the user manual's specification tables; every other model matches but has no range, so its setpoints refuse until the config names a limit. \
The guide has no resistance measurement query, so resistance is not read. \
The interfaces are RS-232, USB and GPIB with no LAN port in the guide. RS-232 offers 4800, 9600, 19200, 38400, 57600 or 115200 baud, 8 data bits with no parity or 7 bits with even or odd parity, set with Shift + System on the front panel, and the guide names no default. The guide contradicts itself on the cable: it says the load can connect to a PC through a null modem cable, and later says to use a straight-through cable and not a null modem cable. \
SYST:REM puts the load in remote mode and disables every front-panel key except LOCAL. \
The function query reply form is not stated; the profile accepts the short and the long word. \
A protection trip latches the input off until the Clear setter's command, which restores the earlier input state, so send it only once the fault is gone. The protection state reads the questionable status condition register: bit 1 overcurrent, bit 3 overpower, bit 4 overtemperature and bit 12 overvoltage. The slew rate is in A/us and the profile scales it to A/s; the rise rate is CURR:SLEW:POS and the fall rate is CURR:SLEW:NEG, and the both-edges command is not used. The current range command takes MIN for the low range and MAX for the high range; its query returns a number that depends on the model, so the range is set but not read. The load has one voltage range, so there is no voltage range setter. Save takes 0 to 100 and recall takes 0 to 9, so the profile offers 0 to 9. SYST:RWL locks every key including LOCAL until SYST:LOC. The display text command needs DISP:MODE TEXT and a row number and has no clear command, so the profile has no display functions."""

[evidence]
badge = "manual"
source = "ITECH Series IT8800 Programmable DC Electronic Load Programming Guide, V2.1, 2022; IT8800 Series User's Manual (ratings)"
url = "https://assets.testequity.com/te1/Documents/pdf/itech/ITECH_IT8800-Programming-Guide-EN.pdf"
date = "2026-10-22"

[match]
manufacturer = '(?i)^itech'
model = '^IT88(?:11|12[BC]?|13[BC]?|14[BC]?|16[BC]?|17[BC]?|18[BCD]?|3[0-3][BH]?|3[4-9][BH])$'

[link]
remote = "SYST:REM"
local = "SYST:LOC"
locks_panel = true

[errors]
query = "SYST:ERR?"

[system]
save = "*SAV {slot}"
recall = "*RCL {slot}"
slots = { min = 0, max = 9 }
lock = "SYST:RWL"
unlock = "SYST:LOC"

[[ranges.models]]
model = '^IT8811$'
voltage = { min = 0, max = 120, digits = 3 }
current = { min = 0, max = 30, digits = 4 }
power = { min = 0, max = 150, digits = 2 }
resistance = { min = 0.05, max = 7500, digits = 3 }

[[ranges.models]]
model = '^IT8812$'
voltage = { min = 0, max = 120, digits = 3 }
current = { min = 0, max = 30, digits = 4 }
power = { min = 0, max = 250, digits = 2 }
resistance = { min = 0.05, max = 7500, digits = 3 }

[[ranges.models]]
model = '^IT8812B$'
voltage = { min = 0, max = 500, digits = 3 }
current = { min = 0, max = 15, digits = 4 }
power = { min = 0, max = 200, digits = 2 }
resistance = { min = 0.3, max = 7500, digits = 3 }

[[ranges.models]]
model = '^IT8812C$'
voltage = { min = 0, max = 120, digits = 3 }
current = { min = 0, max = 60, digits = 4 }
power = { min = 0, max = 250, digits = 2 }
resistance = { min = 0.05, max = 7500, digits = 3 }

[signals.voltage]
query = "MEAS:VOLT?"
parse = "float"

[signals.current]
query = "MEAS:CURR?"
parse = "float"

[signals.power]
query = "MEAS:POW?"
parse = "float"

[state.current_set]
query = "SOUR:CURR:LEV:IMM?"
parse = "float"

[state.voltage_set]
query = "SOUR:VOLT:LEV:IMM?"
parse = "float"

[state.power_set]
query = "SOUR:POW:LEV:IMM?"
parse = "float"

[state.resistance_set]
query = "SOUR:RES:LEV:IMM?"
parse = "float"

[state.output]
query = "SOUR:INP:STAT?"
parse = "bool"

[state.mode]
query = "SOUR:FUNC?"
parse = "map"
map = { CURR = "cc", CURRENT = "cc", VOLT = "cv", VOLTAGE = "cv", POW = "cp", POWER = "cp", RES = "cr", RESISTANCE = "cr" }

[state.short]
query = "SOUR:INP:SHOR:STAT?"
parse = "bool"

[state.slew_rise_set]
query = "SOUR:CURR:SLEW:POS?"
parse = "float"
scale = 1e6

[state.slew_fall_set]
query = "SOUR:CURR:SLEW:NEG?"
parse = "float"
scale = 1e6

[state.protection]
flags = [
  { query = "STAT:QUES:COND?", parse = "bits", mask = 4096, shift = 12, value = "ovp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 2, shift = 1, value = "ocp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 8, shift = 3, value = "opp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 16, shift = 4, value = "otp" },
]

[setters.current]
command = "SOUR:CURR:LEV:IMM {value}"

[setters.voltage]
command = "SOUR:VOLT:LEV:IMM {value}"

[setters.power]
command = "SOUR:POW:LEV:IMM {value}"

[setters.resistance]
command = "SOUR:RES:LEV:IMM {value}"

[setters.function]
command = "SOUR:FUNC {function}"
map = { cc = "CURR", cv = "VOLT", cp = "POW", cr = "RES" }

[setters.output]
command = "SOUR:INP:STAT {on}"

[setters.short]
command = "SOUR:INP:SHOR {on}"

[setters.current_range]
command = "SOUR:CURR:RANG {value}"
map = { low = "MIN", high = "MAX" }

[setters.slew_rise]
command = "SOUR:CURR:SLEW:POS {value}"
scale = 1e6

[setters.slew_fall]
command = "SOUR:CURR:SLEW:NEG {value}"
scale = 1e6

[setters.clear]
command = "SOUR:PROT:CLE"
