schema = 1
id = "siglent-sdl1000x"
name = "Siglent SDL1000X series"
category = "load"
notes = """\
Transcribed from the programming guide, not tried on a unit. The guide has no error-queue query, no protection-status query and no remote or local command, so none are used and set commands are checked by readback only. \
The mode reply is read as the full word the guide shows (RESISTANCE); a unit that answers with the short form reads as unknown. The LED function has no label here and reads as unknown. \
The guide does not name the LAN socket port; the profile uses 5025. The setpoint queries return the preset of the selected function, so each is meaningful only while that function is the active one. \
The SDL1000X-E models measure with 1 mV and 1 mA resolution."""

[evidence]
badge = "manual"
source = "Siglent SDL1000X Programmable DC Electronic Load Programming Guide, E02B"
url = "https://int.siglent.com/u_file/download/23_10_09/SDL1000X_programming_guide_E02B.pdf"
date = "2026-10-20"

[match]
manufacturer = '(?i)^siglent'
model = '^SDL10[23]0X(-E)?$'

[ranges]
voltage = { min = 0, max = 150, digits = 3 }
current = { min = 0, max = 30, digits = 3 }
power = { min = 0, max = 200, digits = 3 }
resistance = { min = 0.03, max = 10000, digits = 3 }

[[ranges.models]]
model = '^SDL1030X'
power = { min = 0, max = 300, digits = 3 }

[signals.voltage]
query = "MEAS:VOLT?"
parse = "float"

[signals.current]
query = "MEAS:CURR?"
parse = "float"

[signals.power]
query = "MEAS:POW?"
parse = "float"

[signals.resistance]
query = "MEAS:RES?"
parse = "float"

[state.current_set]
query = ":SOUR:CURR:LEV:IMM?"
parse = "float"

[state.voltage_set]
query = ":SOUR:VOLT:LEV:IMM?"
parse = "float"

[state.power_set]
query = ":SOUR:POW:LEV:IMM?"
parse = "float"

[state.resistance_set]
query = ":SOUR:RES:LEV:IMM?"
parse = "float"

[state.output]
query = ":SOUR:INP:STAT?"
parse = "bool"

[state.mode]
query = ":SOUR:FUNC?"
parse = "map"
map = { CURRENT = "cc", VOLTAGE = "cv", POWER = "cp", RESISTANCE = "cr" }

[setters.current]
command = ":SOUR:CURR:LEV:IMM {value}"

[setters.voltage]
command = ":SOUR:VOLT:LEV:IMM {value}"

[setters.power]
command = ":SOUR:POW:LEV:IMM {value}"

[setters.resistance]
command = ":SOUR:RES:LEV:IMM {value}"

[setters.function]
command = ":SOUR:FUNC {function}"
map = { cc = "CURR", cv = "VOLT", cp = "POW", cr = "RES" }

[setters.output]
command = ":SOUR:INP:STAT {on}"
