schema = 1
id = "itech-it8500-plus"
name = "ITECH IT8500+ series"
category = "load"
notes = """Transcribed from the programming guide, not tried on a unit. The guide covers the IT8511+, IT8511A+, IT8512+, IT8512A+, IT8512B+, IT8512C+, IT8512H+, IT8513A+, IT8513B+, IT8513C+, IT8514B+, IT8514C+ and IT8516C+; the profile matches all of them and the IT8511B+, which the guide cover omits and the user manual lists. The voltage, current and power ratings and the lowest resistance setting of each model come from the user manual's model table and specification tables, and every model's top resistance setting is 7.5 kOhm. The guide's example identity reply is "ITECH Ltd, IT85XX, ..." and does not show whether the model ends in +, so the match accepts it with or without. The serial settings are 4800, 9600, 19200 or 38400 baud, 8 data bits, 1 stop bit and no parity, with a default of 9600 and a load address from 0 to 31 that defaults to 0. The rear DB9 of most models is TTL level and needs an IT-E121 or IT-E123 communication module for RS-232; the IT8513B+, IT8514B+, IT8514C+ and IT8516C+ have RS-232 and USB built in. SYST:REM puts the load in remote mode and disables every front-panel key except LOCAL and SHIFT. The function query reply form is not stated; the profile accepts the short and the long word. DYNAMIC, LED and IMPEDANCE read as unknown. The protection state reads the questionable status condition register: bit 1 overcurrent, bit 3 overpower, bit 4 overtemperature and bit 13 overvoltage. The latched trip stays until PROT:CLE, which the guide names in text but lists no command entry for, so the profile has no Clear setter. libsigrok drives IT8500+ loads such as the IT8511+ with ITECH's 26-byte binary frame protocol at a default of 38400 baud, and a load answering in that protocol does not answer *IDN?. The slew rate is in A/us and the profile scales it to A/s; the Slew setter sets both edges (CURR:SLEW), and the rise and fall setters send CURR:SLEW:RISE and CURR:SLEW:FALL. The current and voltage range commands take MIN for the low range and MAX for the high range; their queries return a number that depends on the model, so the ranges are set but not read, and the voltage auto range is not offered. Save takes 0 to 99 and recall takes 0 to 9, so the profile offers 0 to 9. SYST:RWL locks every key including LOCAL until SYST:LOC."""

[evidence]
badge = "manual"
source = "ITECH Series IT8500+ DC Programmable Electronic Load Programming Guide, V1.3, 2021; IT8500plus Series User Manual, V2.2, 2021 (ratings)"
url = "https://www.welectron.com/mediafiles/guides/itech/ITECH_IT8500+_Programming-Guide.pdf"
date = "2026-10-22"

[match]
manufacturer = '(?i)^itech'
model = '^IT85(?:11[AB]?|12[ABCH]?|13[ABC]|14[BC]|16C)\+?$'

[link]
baud = 9600
remote = "SYST:REM"
local = "SYST:LOC"
locks_panel = true

[errors]
query = "SYST:ERR?"

[system]
save = "*SAV {slot}"
recall = "*RCL {slot}"
slots = { min = 0, max = 9 }
lock = "SYST:RWL"
unlock = "SYST:LOC"

[[ranges.models]]
model = '^IT8511\+?$'
voltage = { min = 0, max = 120, digits = 3 }
current = { min = 0, max = 30, digits = 4 }
power = { min = 0, max = 150, digits = 2 }
resistance = { min = 0.05, max = 7500, digits = 3 }

[[ranges.models]]
model = '^IT8511A\+?$'
voltage = { min = 0, max = 150, digits = 3 }
current = { min = 0, max = 30, digits = 4 }
power = { min = 0, max = 150, digits = 2 }
resistance = { min = 0.05, max = 7500, digits = 3 }

[[ranges.models]]
model = '^IT8511B\+?$'
voltage = { min = 0, max = 500, digits = 3 }
current = { min = 0, max = 10, digits = 4 }
power = { min = 0, max = 150, digits = 2 }
resistance = { min = 0.5, max = 7500, digits = 3 }

[[ranges.models]]
model = '^IT8512\+?$'
voltage = { min = 0, max = 120, digits = 3 }
current = { min = 0, max = 30, digits = 4 }
power = { min = 0, max = 300, digits = 2 }
resistance = { min = 0.05, max = 7500, digits = 3 }

[[ranges.models]]
model = '^IT8512A\+?$'
voltage = { min = 0, max = 150, digits = 3 }
current = { min = 0, max = 30, digits = 4 }
power = { min = 0, max = 300, digits = 2 }
resistance = { min = 0.05, max = 7500, digits = 3 }

[[ranges.models]]
model = '^IT8512B\+?$'
voltage = { min = 0, max = 500, digits = 3 }
current = { min = 0, max = 15, digits = 4 }
power = { min = 0, max = 300, digits = 2 }
resistance = { min = 0.3, max = 7500, digits = 3 }

[[ranges.models]]
model = '^IT8512C\+?$'
voltage = { min = 0, max = 120, digits = 3 }
current = { min = 0, max = 60, digits = 4 }
power = { min = 0, max = 300, digits = 2 }
resistance = { min = 0.05, max = 7500, digits = 3 }

[[ranges.models]]
model = '^IT8512H\+?$'
voltage = { min = 0, max = 800, digits = 3 }
current = { min = 0, max = 5, digits = 4 }
power = { min = 0, max = 300, digits = 2 }
resistance = { min = 2, max = 7500, digits = 3 }

[[ranges.models]]
model = '^IT8513A\+?$'
voltage = { min = 0, max = 150, digits = 3 }
current = { min = 0, max = 60, digits = 4 }
power = { min = 0, max = 400, digits = 2 }
resistance = { min = 0.1, max = 7500, digits = 3 }

[[ranges.models]]
model = '^IT8513B\+?$'
voltage = { min = 0, max = 500, digits = 3 }
current = { min = 0, max = 30, digits = 4 }
power = { min = 0, max = 600, digits = 2 }
resistance = { min = 0.05, max = 7500, digits = 3 }

[[ranges.models]]
model = '^IT8513C\+?$'
voltage = { min = 0, max = 120, digits = 3 }
current = { min = 0, max = 120, digits = 4 }
power = { min = 0, max = 600, digits = 2 }
resistance = { min = 0.05, max = 7500, digits = 3 }

[[ranges.models]]
model = '^IT8514B\+?$'
voltage = { min = 0, max = 500, digits = 3 }
current = { min = 0, max = 60, digits = 4 }
power = { min = 0, max = 1500, digits = 2 }
resistance = { min = 0.05, max = 7500, digits = 3 }

[[ranges.models]]
model = '^IT8514C\+?$'
voltage = { min = 0, max = 120, digits = 3 }
current = { min = 0, max = 240, digits = 4 }
power = { min = 0, max = 1500, digits = 2 }
resistance = { min = 0.05, max = 7500, digits = 3 }

[[ranges.models]]
model = '^IT8516C\+?$'
voltage = { min = 0, max = 120, digits = 3 }
current = { min = 0, max = 240, digits = 4 }
power = { min = 0, max = 3000, digits = 2 }
resistance = { min = 0.05, max = 7500, digits = 3 }

[signals.voltage]
query = "MEAS:VOLT?"
parse = "float"

[signals.current]
query = "MEAS:CURR?"
parse = "float"

[signals.power]
query = "MEAS:POW?"
parse = "float"

[signals.resistance]
query = "MEAS:RES?"
parse = "float"

[state.current_set]
query = "SOUR:CURR:LEV:IMM?"
parse = "float"

[state.voltage_set]
query = "SOUR:VOLT:LEV:IMM?"
parse = "float"

[state.power_set]
query = "SOUR:POW:LEV:IMM?"
parse = "float"

[state.resistance_set]
query = "SOUR:RES:LEV:IMM?"
parse = "float"

[state.slew_set]
query = "CURR:SLEW?"
parse = "float"
scale = 1e6

[state.short]
query = "SOUR:INP:SHOR?"
parse = "bool"

[state.slew_rise_set]
query = "SOUR:CURR:SLEW:RISE?"
parse = "float"
scale = 1e6

[state.slew_fall_set]
query = "SOUR:CURR:SLEW:FALL?"
parse = "float"
scale = 1e6

[state.output]
query = "SOUR:INP:STAT?"
parse = "bool"

[state.mode]
query = "SOUR:FUNC?"
parse = "map"
map = { CURR = "cc", CURRENT = "cc", VOLT = "cv", VOLTAGE = "cv", POW = "cp", POWER = "cp", RES = "cr", RESISTANCE = "cr" }

[state.protection]
flags = [
  { query = "STAT:QUES:COND?", parse = "bits", mask = 8192, shift = 13, value = "ovp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 2, shift = 1, value = "ocp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 8, shift = 3, value = "opp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 16, shift = 4, value = "otp" },
]

[setters.current]
command = "SOUR:CURR:LEV:IMM {value}"

[setters.voltage]
command = "SOUR:VOLT:LEV:IMM {value}"

[setters.power]
command = "SOUR:POW:LEV:IMM {value}"

[setters.resistance]
command = "SOUR:RES:LEV:IMM {value}"

[setters.slew]
command = "CURR:SLEW {value}"
scale = 1e6

[setters.function]
command = "SOUR:FUNC {function}"
map = { cc = "CURR", cv = "VOLT", cp = "POW", cr = "RES" }

[setters.output]
command = "SOUR:INP:STAT {on}"

[setters.short]
command = "SOUR:INP:SHOR {on}"

[setters.current_range]
command = "SOUR:CURR:RANG {value}"
map = { low = "MIN", high = "MAX" }

[setters.voltage_range]
command = "SOUR:VOLT:RANG {value}"
map = { low = "MIN", high = "MAX" }

[setters.slew_rise]
command = "SOUR:CURR:SLEW:RISE {value}"
scale = 1e6

[setters.slew_fall]
command = "SOUR:CURR:SLEW:FALL {value}"
scale = 1e6
