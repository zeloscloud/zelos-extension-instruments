schema = 1
id = "generic-acsource"
name = "Generic SCPI AC source"
category = "acsource"
generic = true
notes = """Used when no profile matches the instrument. It probes MEAS:VOLT:AC?, MEAS:CURR:AC?, MEAS:POW:AC?, MEAS:FREQ?, VOLT?, FREQ? and OUTP?, and drops each one the instrument rejects at start. Setpoint ranges come from VOLT? MAX and FREQ? MAX. AC sources that use FETC or SOUR:VOLT:LEV forms instead need their own profile. This profile has no channel select."""

[evidence]
badge = "manual"
source = "SCPI-99 Standard Commands for Programmable Instruments, Volume 2"
url = "https://www.ivifoundation.org/downloads/SCPI/scpi-99.pdf"
date = "2026-10-20"

[errors]
query = "SYST:ERR?"

[ranges]
voltage = { max_query = "VOLT? MAX", digits = 3 }
frequency = { max_query = "FREQ? MAX", digits = 3 }

[signals.voltage]
query = "MEAS:VOLT:AC?"
parse = "float"
optional = true

[signals.current]
query = "MEAS:CURR:AC?"
parse = "float"
optional = true

[signals.power]
query = "MEAS:POW:AC?"
parse = "float"
optional = true

[signals.frequency]
query = "MEAS:FREQ?"
parse = "float"
optional = true

[state.voltage_set]
query = "VOLT?"
parse = "float"
optional = true

[state.frequency_set]
query = "FREQ?"
parse = "float"
optional = true

[state.output]
query = "OUTP?"
parse = "bool"
optional = true

[setters.voltage]
command = "VOLT {value}"

[setters.frequency]
command = "FREQ {value}"

[setters.output]
command = "OUTP {on}"
