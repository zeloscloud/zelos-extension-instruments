[signals.voltage]
query = "FETC:VOLT?"
parse = "float"

[signals.current]
query = "FETC:CURR?"
parse = "float"

[signals.power]
query = "FETC:POW?"
parse = "float"

[signals.apparent_power]
query = "FETC:POW:APP?"
parse = "float"

[signals.power_factor]
query = "FETC:POW:PFAC?"
parse = "float"

[signals.frequency]
query = "FETC:FREQ?"
parse = "float"

[state.voltage_set]
query = "VOLT?"
parse = "float"

[state.frequency_set]
query = "FREQ?"
parse = "float"

[state.current_set]
query = "CURR?"
parse = "float"

[state.output]
query = "OUTP?"
parse = "bool"

[state.protection]
flags = [
  { query = "STAT:QUES:COND?", parse = "bits", mask = 3, value = "ovp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 24, value = "ocp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 32, shift = 5, value = "opp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 128, shift = 7, value = "otp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 68, value = "other" },
]

[setters.voltage]
command = "VOLT {value}"

[setters.frequency]
command = "FREQ {value}"

[setters.current]
command = "CURR {value}"

[setters.output]
command = "OUTP {on}"

[setters.clear]
command = "OUTP:PROT:CLE"
