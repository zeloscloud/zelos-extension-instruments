schema = 1
id = "keysight-ac6800b"
name = "Keysight AC6800B series"
category = "acsource"
notes = """\
Transcribed from the operating and service guide, not tried on a unit. The AC voltage has two ranges, 155 V and 310 V, and VOLT:RANG selects one; the voltage limit in ranges is the 310 V range, and a level above the active range is rejected. \
The current limit is 5 A, 10 A, 20 A or 40 A (AC6801B to AC6804B) in the 155 V range and half of it in the 310 V range, and the profile uses the 155 V figure. The frequency range is 40 Hz to 500 Hz. \
The current setpoint is the rms current limit, not a load current. \
OUTP:COUP AC|DC|ACDC selects the output coupling, and the profile sets AC quantities only, so use AC coupling with it: the DC voltage and DC current are separate commands (VOLT:OFFS and CURR:OFFS) that the profile does not set. \
The protection state reads the questionable status condition register: weight 1 overvoltage, 2 overcurrent, 512 overpower, 16 overtemperature, and 4, 32, 64 and 8192 for hardware failure, watchdog, remote inhibit and sense fault. The Clear setter resets the latched protection. \
Remote connection is LAN (raw socket on port 5025, VXI-11, HiSLIP), USB, and optional GPIB."""

[evidence]
badge = "manual"
source = "Keysight AC6800B Series Basic AC Sources Operating and Service Guide, AC6800-90901, Edition 2, April 2019"
url = "https://transcat.ca/media/pdf/keysight-AC6800B-user-manual.pdf"
date = "2026-10-20"

[match]
manufacturer = '(?i)^keysight'
model = '^AC680[1-4]B$'

[link]
lan_port = 5025

[errors]
query = "SYST:ERR?"

[ranges]
voltage = { min = 0, max = 310, digits = 3 }
current = { min = 0, max = 5, digits = 3 }
frequency = { min = 40, max = 500, digits = 3 }

[[ranges.models]]
model = '^AC6802B$'
current = { min = 0, max = 10, digits = 3 }

[[ranges.models]]
model = '^AC6803B$'
current = { min = 0, max = 20, digits = 3 }

[[ranges.models]]
model = '^AC6804B$'
current = { min = 0, max = 40, digits = 3 }

[signals.voltage]
query = "MEAS:VOLT:AC?"
parse = "float"

[signals.current]
query = "MEAS:CURR:AC?"
parse = "float"

[signals.power]
query = "MEAS:POW:AC?"
parse = "float"

[signals.apparent_power]
query = "MEAS:POW:AC:APP?"
parse = "float"

[signals.power_factor]
query = "MEAS:POW:AC:PFAC?"
parse = "float"

[signals.frequency]
query = "MEAS:FREQ?"
parse = "float"

[state.voltage_set]
query = "VOLT?"
parse = "float"

[state.frequency_set]
query = "FREQ?"
parse = "float"

[state.current_set]
query = "CURR?"
parse = "float"

[state.output]
query = "OUTP?"
parse = "bool"

[state.protection]
flags = [
  { query = "STAT:QUES:COND?", parse = "bits", mask = 1, value = "ovp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 2, shift = 1, value = "ocp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 512, shift = 9, value = "opp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 16, shift = 4, value = "otp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 8292, value = "other" },
]

[setters.voltage]
command = "VOLT {value}"

[setters.frequency]
command = "FREQ {value}"

[setters.current]
command = "CURR {value}"

[setters.output]
command = "OUTP {on}"

[setters.clear]
command = "OUTP:PROT:CLE"
