schema = 1
id = "owon-spe-p4000"
name = "OWON SPE and P4000 series"
category = "psu"
notes = """Covers the SPE3103, SPE6103, P4305 and P4603 single-output supplies. \
The programming manual gives no ratings and names no series; its IDN example is for a P4305: OWON,P4305,1715040,FV:V1.0.2. \
The ranges are the models' published ratings, which no manual read for this profile states: SPE3103 30 V at 10 A, SPE6103 60 V at 10 A, P4305 30 V at 5 A, P4603 60 V at 3 A. The P4000 user manual's factory limits, 61.00 V and 3.10 A, fit a 60 V, 3 A unit. \
The manual does not say that remote mode must be set first, so no remote command is sent; the Local action sends SYST:LOC. \
A P4603 driver says SYST:REM and SYST:LOC do not work on that model. \
VOLT:LIM and CURR:LIM are the overvoltage and overcurrent protection values, not setpoint limits. \
MEAS:ALL:INFO? reports the operating mode and the OVP, OCP and OTP faults. The manual shows its values separated by spaces, but real units separate them with commas, as in 57.430,0.059,3.390,OFF,OFF,OFF,1, so mode and protection are read from it. \
Mode 0 is standby, read as off; mode 3, a failure, reads as unknown. \
The manual lists only *IDN? and *RST as common commands, so the profile has no self-test, no operation-complete wait and no save, recall, beep, display or lock; its *RST text says it resets an oscilloscope, which is a copy error. The manual documents no error query, so sets are verified by readback only, and no protection clear command. \
The P4000 user manual gives the RS-232 factory default as 115200 baud, 8 data bits, no parity and 1 stop bit, and the profile uses 115200 baud. The serial defaults of the SPE models are not in the manuals read: set the baud rate in the config if a unit differs. The LAN settings are not in any manual read and stay at the profile defaults."""

[evidence]
badge = "manual"
source = "OWON Single Channel DC Power Supply Programming Manual; OWON P Series Single Channel Output DC Power Supply User Manual, Sep. 2020 edition V1.2.0 (serial defaults); model ratings from OWON product listings, not checked against a manual"
url = "https://tm-co.co.jp/wp/wp-content/uploads/2025/07/SP_and_SPE_SPS_programming_manual.pdf"
date = "2026-10-22"

[match]
manufacturer = '(?i)^owon'
model = '(?i)^(SPE3103|SPE6103|P4305|P4603)$'
channels = 1

[link]
baud = 115200
local = "SYST:LOC"

[system]
self_test = false
opc = false

[ranges]
voltage = { min = 0, max = 30, digits = 2 }
current = { min = 0, max = 10, digits = 3 }

[[ranges.models]]
model = '(?i)^SPE6103$'
voltage = { min = 0, max = 60, digits = 2 }

[[ranges.models]]
model = '(?i)^P4305$'
current = { min = 0, max = 5, digits = 3 }

[[ranges.models]]
model = '(?i)^P4603$'
voltage = { min = 0, max = 60, digits = 2 }
current = { min = 0, max = 3, digits = 3 }

[signals.voltage]
query = "MEAS:VOLT?"
parse = "float"

[signals.current]
query = "MEAS:CURR?"
parse = "float"

[signals.power]
query = "MEAS:POW?"
parse = "float"

[state.voltage_set]
query = "VOLT?"
parse = "float"

[state.current_set]
query = "CURR?"
parse = "float"

[state.ovp_set]
query = "VOLT:LIM?"
parse = "float"

[state.ocp_set]
query = "CURR:LIM?"
parse = "float"

[state.output]
query = "OUTP?"
parse = "bool"

[state.mode]
query = "MEAS:ALL:INFO?"
parse = "map"
index = 6
map = { "0" = "off", "1" = "cv", "2" = "cc" }

[state.protection]
flags = [
  { query = "MEAS:ALL:INFO?", parse = "bool", index = 3, value = "ovp" },
  { query = "MEAS:ALL:INFO?", parse = "bool", index = 4, value = "ocp" },
  { query = "MEAS:ALL:INFO?", parse = "bool", index = 5, value = "otp" },
]

[setters.voltage]
command = "VOLT {value}"

[setters.current]
command = "CURR {value}"

[setters.ovp]
command = "VOLT:LIM {value}"

[setters.ocp]
command = "CURR:LIM {value}"

[setters.output]
command = "OUTP {bit}"
