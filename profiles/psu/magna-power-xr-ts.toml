schema = 1
id = "magna-power-xr-ts"
name = "Magna-Power XR and TS series"
category = "psu"
notes = """Covers the XR Series IV and TS series programmable DC supplies. \
The manual starts and stops the output with two commands, OUTP:START and OUTP:STOP, and has no single on/off command, so the profile has no output setter: switch the output with the front panel, the digital inputs or a script. OUTP? reads the output state (1 while the power circuit is processing power). \
The supply takes its setpoints from the interface chosen with CONF:SETPT (0 ROTARY, 1 KEYPAD, 2 EXT PGM, 3 REMOTE). The XR documentation says full SCPI programming needs the REMOTE source, and that only a reduced set of commands and queries stays available in ROTARY or EXT PGM so that computer communication keeps working. The manual does not say which stored setpoint applies when the source changes, so the profile sends no CONF:SETPT at connect: send CONF:SETPT 3 with the raw command action before setting voltage or current. The Local action sends CONF:SETPT 0 (ROTARY). \
The manual lists no power measurement, so power is not read. \
Ranges are read from the instrument after connecting (VOLT? MIN and MAX, CURR? MIN and MAX); the OVP and OCP levels are bounded by VOLT:PROT? and CURR:PROT? with MIN and MAX. \
CONF:REM:SENS reads and sets remote voltage sensing. The manual has no *TST? self-test, and it documents *OPC? only for the GPIB option, so this profile has neither. *SAV stores the setpoints and the protection levels in one of the locations 0 to 99, and the manual has no *RCL, so recalling a stored state is a front-panel job. \
Mode reads constant voltage and constant current from the operation condition register; zero shows as off. \
Protection reads OV, OC and OT from the questionable condition register, and the phase balance, program line, fuse, alarm and interlock bits as other. \
Clear resets the alarm latches once the cause is gone. \
RS-232 runs at 19200 baud; the Ethernet socket port defaults to 50505 and the GPIB option accepts the same commands. \
The IDN reply is four fields: Magna-Power Electronics Inc., <model>, <serial>, <firmware>."""

[evidence]
badge = "manual"
source = "MagnaDC TS Series Documentation, Release 1, January 2022 (SCPI Command Set); MagnaDC XR Series Documentation, online edition (SCPI Programming)"
url = "https://magna-power.com/assets/files/manuals/ts_49297.pdf"
date = "2026-10-22"

[match]
manufacturer = '(?i)^magna-?power'
model = '(?i)^(XRC?|TSD?)\d'
channels = 1

[link]
lan_port = 50505
baud = 19200
local = "CONF:SETPT 0"

[errors]
query = "SYST:ERR?"

[system]
self_test = false
opc = false
save = "*SAV {slot}"
slots = { min = 0, max = 99 }

[ranges]
voltage = { min_query = "VOLT? MIN", max_query = "VOLT? MAX", digits = 3 }
current = { min_query = "CURR? MIN", max_query = "CURR? MAX", digits = 3 }
ovp = { min_query = "VOLT:PROT? MIN", max_query = "VOLT:PROT? MAX", digits = 3 }
ocp = { min_query = "CURR:PROT? MIN", max_query = "CURR:PROT? MAX", digits = 3 }

[signals.voltage]
query = "MEAS:VOLT?"
parse = "float"

[signals.current]
query = "MEAS:CURR?"
parse = "float"

[state.voltage_set]
query = "VOLT?"
parse = "float"

[state.current_set]
query = "CURR?"
parse = "float"

[state.ovp_set]
query = "VOLT:PROT?"
parse = "float"

[state.ocp_set]
query = "CURR:PROT?"
parse = "float"

[state.output]
query = "OUTP?"
parse = "bool"

[state.remote_sense]
query = "CONF:REM:SENS?"
parse = "bool"

[state.mode]
query = "STAT:OPER:COND?"
parse = "bits"
mask = 1280
shift = 8
map = { "0" = "off", "1" = "cv", "4" = "cc" }

[state.protection]
flags = [
  { query = "STAT:QUES:COND?", parse = "bits", mask = 1, value = "ovp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 2, value = "ocp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 16, value = "otp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 428, value = "other" },
]

[setters.voltage]
command = "VOLT {value}"

[setters.current]
command = "CURR {value}"

[setters.ovp]
command = "VOLT:PROT {value}"

[setters.ocp]
command = "CURR:PROT {value}"

[setters.remote_sense]
command = "CONF:REM:SENS {on}"

[setters.clear]
command = "OUTP:PROT:CLE"
