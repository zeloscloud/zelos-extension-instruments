schema = 1
id = "keithley-2220-2230"
name = "Keithley 2220 and 2230 multichannel DC power supplies"
category = "psu"
notes = """Covers the 2220-30-1 (two channels) and the 2230-30-1 (three channels) with the G, J and GJ variants. \
Channels 1 and 2 are 30 V at 1.5 A; channel 3 of the 2230 is 6 V at 5 A. \
Setpoints use INST:SEL CH<n> followed by bare VOLT and CURR; measurements take the channel as an argument. \
The output setter is CHAN:OUTP, which switches the selected channel. OUTP (all enabled channels) and OUTP:ENAB (the Channel Enable menu) are not used. \
Interfaces are USB (USBTMC) and, on G models, GPIB; there is no LAN or RS-232 port. \
SYST:REM sets remote mode. The manual says RWLock locks the front panel and does not say whether plain remote mode locks the other keys, so locks_panel is set to be safe. \
Protection is not read: the manual's status registers have no OVP or OCP bit. \
The manual gives the voltage limit (VOLT:LIM), not an OVP level, so the OVP setter is omitted. \
The 2220/2230 IDN example in the manual prints spaces around each comma and a typographic dash in the model."""

[evidence]
badge = "manual"
source = "Series 2200 Programmable Multichannel DC Power Supplies Programmer Manual, 2220S-907-01 Rev. B, December 2013; User's Manual 2220S-900-01 Rev. A, June 2012 (channel ratings)"
url = "https://download.tek.com/manual/Series-2200-Programmable-Multichannel-DC-Power-Supply-ProgrammerManual.pdf"
date = "2026-10-20"

[match]
manufacturer = '(?i)^keithley'
model = '(?i)^(MODEL ?)?22[23]0[GJ]*-30.1$'
channels = 2

[[match.models]]
model = '(?i)2230'
channels = 3

[link]
select = "INST:SEL CH{ch}"
remote = "SYST:REM"
local = "SYST:LOC"
locks_panel = true

[errors]
query = "SYST:ERR?"

[ranges]
voltage = { min = 0, max = 30, digits = 3 }
current = { min = 0, max = 1.5, digits = 4 }

[[ranges.models]]
model = '(?i)2230'
channel = 3
voltage = { min = 0, max = 6, digits = 3 }
current = { min = 0, max = 5, digits = 4 }

[signals.voltage]
query = "MEAS:VOLT? CH{ch}"
parse = "float"

[signals.current]
query = "MEAS:CURR? CH{ch}"
parse = "float"

[signals.power]
query = "MEAS:POW? CH{ch}"
parse = "float"

[state.voltage_set]
query = "VOLT?"
parse = "float"

[state.current_set]
query = "CURR?"
parse = "float"

[state.output]
query = "CHAN:OUTP?"
parse = "bool"

[state.mode]
query = "STAT:OPER:INST:ISUM{ch}:COND?"
parse = "bits"
mask = 3
map = { "0" = "off", "1" = "cv", "2" = "cc" }

[setters.voltage]
command = "VOLT {value}"

[setters.current]
command = "CURR {value}"

[setters.output]
command = "CHAN:OUTP {bit}"
