schema = 1
id = "rohde-schwarz-ngl-ngm"
name = "Rohde & Schwarz NGL200 and NGM200 series"
category = "psu"
notes = """Covers the NGL201, NGM201 (one channel) and the NGL202, NGM202 (two channels), read as sources. \
These are two-quadrant supplies: they also sink current. OUTP:MODE selects AUTO, SINK or SOURce, and sink current shows as negative current. \
The extension reads and sets the source side only; the sink side, constant-resistance mode and output mode are not wired. \
The current limit is 6.01 A up to 6 V and 3.01 A above 6 V; the range below carries the 6.01 A figure, and the instrument refuses a higher current at a higher voltage. \
Channel commands act on the channel chosen with INST:NSEL, so the extension selects before every query and set. \
SYST:REM locks the front panel; the Local action (SYST:LOC) unlocks it. \
A channel delivers power only while its channel key (OUTP:SEL) and the general output (OUTP:GEN) are both on. \
The manual says OUTP 1 switches on the previously selected channels, so it may also switch on other channels whose OUTP:SEL is on. A bench NGE100 does this; it was not measured on an NGL or NGM. \
So switching a channel on sends OUTP:SEL 1, then OUTP:GEN 1 if the general output is off, as the manual's example does. \
If another channel's key is on while the general output is off, switching a channel on is refused before anything is sent, because the general output would switch that channel on too. \
Switching a channel off sends OUTP:SEL 0 and leaves the general output alone. \
Mode reads the questionable condition register of the channel; zero is shown as off, which the manual does not state. \
Protection reads OVP, OCP (CURR:PROT), OPP and over-temperature. The manual lists the FUSE commands as alternatives to CURR:PROT. The OVP, OCP and OPP functions each have an on/off state; the OVP and OCP states are read and switched, the OPP state is not. \
The OVP level is 0.001 to 20.05 V. \
Clear resets the OVP, OCP and OPP trips of the selected channel. \
The raw socket port is set in the instrument's network dialog; the manual gives no default, so the profile keeps 5025."""

[evidence]
badge = "manual"
source = "R&S NGL200/NGM200 Power Supply Series User Manual, 1178.8736.02, Version 10, firmware 3.060 or higher"
url = "https://scdn.rohde-schwarz.com/ur/pws/dl_downloads/pdm/cl_manuals/user_manual/1178_8736_01/NGL200_NGM200_UserManual_en_10.pdf"
date = "2026-10-21"

[match]
manufacturer = '(?i)^rohde\s*&\s*schwarz'
model = '(?i)^NG[LM]20[12]$'
channels = 1

[[match.models]]
model = '(?i)^NG[LM]202$'
channels = 2

[link]
select = "INST:NSEL {ch}"
remote = "SYST:REM"
local = "SYST:LOC"
locks_panel = true

[errors]
query = "SYST:ERR?"

[ranges]
voltage = { min = 0, max = 20.05, digits = 3 }
current = { min = 0, max = 6.01, digits = 3 }
ovp = { min = 0.001, max = 20.05, digits = 3 }

[signals.voltage]
query = "MEAS:VOLT?"
parse = "float"

[signals.current]
query = "MEAS:CURR?"
parse = "float"

[signals.power]
query = "MEAS:POW?"
parse = "float"

[state.voltage_set]
query = "VOLT?"
parse = "float"

[state.current_set]
query = "CURR?"
parse = "float"

[state.ovp_set]
query = "VOLT:PROT:LEV?"
parse = "float"

[state.ovp_on]
query = "VOLT:PROT?"
parse = "bool"

[state.ocp_on]
query = "CURR:PROT?"
parse = "bool"

[state.output]
query = "OUTP?"
parse = "bool"

[state.mode]
query = "STAT:QUES:INST:ISUM{ch}:COND?"
parse = "bits"
mask = 3
map = { "0" = "off", "1" = "cc", "2" = "cv" }

[state.protection]
flags = [
  { query = "VOLT:PROT:TRIP?", parse = "bool", value = "ovp" },
  { query = "CURR:PROT:TRIP?", parse = "bool", value = "ocp" },
  { query = "POW:PROT:TRIP?", parse = "bool", value = "opp" },
  { query = "STAT:QUES:INST:ISUM{ch}:COND?", parse = "bits", mask = 16, value = "otp" },
]

[setters.voltage]
command = "VOLT {value}"

[setters.current]
command = "CURR {value}"

[setters.ovp]
command = "VOLT:PROT:LEV {value}"

[setters.ovp_on]
command = "VOLT:PROT {bit}"

[setters.ocp_on]
command = "CURR:PROT {bit}"

[setters.output]
command = "OUTP:SEL {bit}"
master = { command = "OUTP:GEN {bit}", query = "OUTP:GEN?", armed = "OUTP:SEL?" }

[setters.clear]
command = ["VOLT:PROT:CLE", "CURR:PROT:CLE", "POW:PROT:CLE"]
