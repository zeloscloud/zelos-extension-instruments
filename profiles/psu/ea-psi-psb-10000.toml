schema = 1
id = "ea-psi-psb-10000"
name = "EA Elektro-Automatik PSI, PSB and PS 10000 series"
category = "psu"
notes = """Covers the single-output PS 10000, PSI 10000 and PSB 10000 (PSBE 10000) models from the 10000 and 20000 series programming guide. \
The PSI 9000 and PSB 9000 series have their own programming guide, which was not available; they are not matched. \
The device never enters remote control by itself and accepts no set command before SYST:LOCK ON, which the profile sends once after connecting. \
It refuses the request when the front-panel Local condition is active, when another interface holds the control or when the setup menu is open. The Local action sends SYST:LOCK OFF. Leaving remote control switches the DC output off unless POWer:STAGe:AFTer:REMote is AUTO, and OFF is the factory setting. \
Ranges are read from the instrument after connecting (SYST:NOM:VOLT? and SYST:NOM:CURR?); setpoints accept up to 102 percent of the rating. \
The PSB 10000 is bidirectional: a negative measured current or power means the supply is sinking. The sink side (SINK:CURR, SINK:POW and their protection levels) is not wired. \
Mode reads constant voltage, constant current and constant power from the operation condition register. \
Protection reads OVP, OCP, OPP and over-temperature from the questionable condition register. \
Alarm bits clear only when the alarm is gone and SYST:ERR? has read it, so the profile has no Clear. The OVP and OCP levels reach 110 percent of the rating, but the extension bounds them by the ranges. \
The manual sets a minimum of 5 ms between two messages and recommends 10 ms on Ethernet and 10 to 15 ms on USB, so the profile pauses 10 ms between commands. \
The LAN socket port defaults to 5025 and can be changed in the device menu; the RS-232 module is fixed at 8 data bits, no parity and 1 stop bit with a variable baud rate. \
The IDN reply is EA Elektro-Automatik GmbH&Co.KG, PSB 10080-340, <serial>, <firmware versions>. \
A real device takes one socket connection at a time, so the extension keeps a single connection. \
After SYST:LOCK ON the profile asks SYST:LOCK:OWN? and opens only when the reply is REMOTE, because the device can refuse remote control. \
The manual lists only *CLS, *IDN?, *RST, *STB?, *ESR?, *ESE and *SRE as common commands, so the self-test and operation-complete query are off. \
*RST switches the device to remote control, turns the DC input and output off and clears the alarm buffer. \
The manual has no save, recall, beep, display, remote-sense, OVP delay or tracking command."""

[evidence]
badge = "manual"
source = "EA Elektro-Automatik Programming Guide ModBus & SCPI for 10000 and 20000 series, 35400100_MA-Programming-10k-20k-EN_01, 2023"
url = "https://download.tek.com/manual/Programming_ModBus_SCPI_10k_20k_REV01_EN.pdf"
date = "2026-10-22"

[match]
manufacturer = '(?i)^EA\s*Elektro'
model = '(?i)^(PSI|PSB|PSBE|PS|PU|PUB)\s*10\d{3}-\d+'
channels = 1

[link]
delay_ms = 10
remote = "SYST:LOCK ON"
local = "SYST:LOCK OFF"
single_client = true
remote_check = { query = "SYST:LOCK:OWN?", expect = "REMOTE" }

[errors]
query = "SYST:ERR?"

[ranges]
voltage = { min = 0, max_query = "SYST:NOM:VOLT?", digits = 3 }
current = { min = 0, max_query = "SYST:NOM:CURR?", digits = 3 }

[signals.voltage]
query = "MEAS:VOLT?"
parse = "float"

[signals.current]
query = "MEAS:CURR?"
parse = "float"

[signals.power]
query = "MEAS:POW?"
parse = "float"

[state.voltage_set]
query = "VOLT?"
parse = "float"

[state.current_set]
query = "CURR?"
parse = "float"

[state.ovp_set]
query = "VOLT:PROT?"
parse = "float"

[state.ocp_set]
query = "CURR:PROT?"
parse = "float"

[state.output]
query = "OUTP?"
parse = "bool"

[state.mode]
query = "STAT:OPER:COND?"
parse = "bits"
mask = 1792
shift = 8
map = { "0" = "off", "1" = "cv", "2" = "cc", "4" = "cp" }

[state.protection]
flags = [
  { query = "STAT:QUES:COND?", parse = "bits", mask = 1, value = "ovp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 2, value = "ocp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 4, value = "opp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 8, value = "otp" },
]

[setters.voltage]
command = "VOLT {value}"

[setters.current]
command = "CURR {value}"

[setters.ovp]
command = "VOLT:PROT {value}"

[setters.ocp]
command = "CURR:PROT {value}"

[setters.output]
command = "OUTP {on}"

[system]
self_test = false
opc = false
