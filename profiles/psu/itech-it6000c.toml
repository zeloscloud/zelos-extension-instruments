schema = 1
id = "itech-it6000c"
name = "ITECH IT6000C series bidirectional power supplies"
category = "psu"
notes = """Covers the bidirectional IT6000C families the data sheet lists (IT6005C to IT6144C), which source and sink power. The identity model string form is not documented, so the match accepts it with or without the IT prefix. \
Voltage and current are set for constant-voltage priority: VOLT sets the voltage and CURR:LIM sets the positive current limit. CURR sets the current in constant-current priority and FUNC VOLT or FUNC CURR switches the priority; neither is wired. \
The sink side (CURR:LIM:NEG, negative power limits and the CC- and CP- states) is not wired; a sinking supply reads its mode as unknown. \
The programming guide gives no per-model ratings, so each range is read from the instrument after connecting (VOLT? MAX and CURR:LIM? MAX). \
The overvoltage and overcurrent levels act only while their protection state is on (VOLT:PROT:STAT and CURR:PROT:STAT, both off by default); the state readers and setters are wired. SENS:REM:STAT? reads whether remote sensing is on. \
SYST:REM sets remote control mode and locks every key except Local; SYST:LOC restores the front panel. \
RS-232 defaults to 9600 baud. The programming guide gives no LAN socket port, so the profile keeps 5025. \
Mode reads off, constant current (positive), constant voltage and constant power (positive) from the operation condition register. \
Protection reads OV, OC, OP and OT from the questionable condition register. \
Clear resets the tripped protections. \
*SAV and *RCL take locations 0 to 9. \
SYST:BEEP:IMM sounds one beep. \
Lock sends SYST:RWL and Unlock sends SYST:REM. \
Remote sense is switched with SENS:REM:STAT. \
The OVP delay (VOLT:PROT:DEL) gives no numeric range and no unit in the manual beyond a default of 60 s, so the profile sends seconds and reads the limits from the unit (VOLT:PROT:DEL? \
MIN and MAX). \
The manual has no tracking command; parallel operation uses PARallel:ROLE, which is not wired."""

[evidence]
badge = "manual"
source = "IT6000C Series Programming Guide, V1.0/01, 2019; IT6000C data sheet, 2021-07-12 (model list)"
url = "https://www.tehencom.com/Companies/ITECH/IT6000C/ITECH_IT6000C_Programming_Manual.pdf"
date = "2026-10-22"

[match]
manufacturer = '(?i)^itech'
model = '(?i)^(?:IT)?(?:60(?:05|06|10|12|15|18|30|36|45|54|60|72|75|90)|61(?:05|08|20|26|44))C'
channels = 1

[link]
baud = 9600
remote = "SYST:REM"
local = "SYST:LOC"
locks_panel = true

[errors]
query = "SYST:ERR?"

[ranges]
voltage = { min = 0, max_query = "VOLT? MAX", digits = 3 }
current = { min = 0, max_query = "CURR:LIM? MAX", digits = 3 }
ovp_delay = { min_query = "VOLT:PROT:DEL? MIN", max_query = "VOLT:PROT:DEL? MAX", digits = 3 }

[signals.voltage]
query = "MEAS:VOLT?"
parse = "float"

[signals.current]
query = "MEAS:CURR?"
parse = "float"

[signals.power]
query = "MEAS:POW?"
parse = "float"

[state.voltage_set]
query = "VOLT?"
parse = "float"

[state.current_set]
query = "CURR:LIM?"
parse = "float"

[state.ovp_set]
query = "VOLT:PROT?"
parse = "float"

[state.ocp_set]
query = "CURR:PROT?"
parse = "float"

[state.ovp_on]
query = "VOLT:PROT:STAT?"
parse = "bool"

[state.ocp_on]
query = "CURR:PROT:STAT?"
parse = "bool"

[state.remote_sense]
query = "SENS:REM:STAT?"
parse = "bool"

[state.ovp_delay_set]
query = "VOLT:PROT:DEL?"
parse = "float"

[state.output]
query = "OUTP?"
parse = "bool"

[state.mode]
query = "STAT:OPER:COND?"
parse = "bits"
mask = 960
shift = 6
map = { "1" = "off", "2" = "cc", "4" = "cv", "8" = "cp" }

[state.protection]
flags = [
  { query = "STAT:QUES:COND?", parse = "bits", mask = 1, value = "ovp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 6, value = "ocp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 24, value = "opp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 64, value = "otp" },
]

[setters.voltage]
command = "VOLT {value}"

[setters.current]
command = "CURR:LIM {value}"

[setters.ovp]
command = "VOLT:PROT {value}"

[setters.ocp]
command = "CURR:PROT {value}"

[setters.ovp_on]
command = "VOLT:PROT:STAT {on}"

[setters.ocp_on]
command = "CURR:PROT:STAT {on}"

[setters.output]
command = "OUTP {bit}"

[setters.clear]
command = "OUTP:PROT:CLE"

[setters.remote_sense]
command = "SENS:REM:STAT {on}"

[setters.ovp_delay]
command = "VOLT:PROT:DEL {value}"

[system]
beep = "SYST:BEEP:IMM"
save = "*SAV {slot}"
recall = "*RCL {slot}"
slots = { min = 0, max = 9 }
lock = "SYST:RWL"
unlock = "SYST:REM"
