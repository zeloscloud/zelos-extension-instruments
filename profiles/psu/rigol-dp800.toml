schema = 1
id = "rigol-dp800"
name = "Rigol DP800 series"
category = "psu"
notes = "The limits are the rated values of each channel from Table 2-1 of the programming guide, and the instrument accepts settings a little above them: 0 V to 32 V and 0 A to 3.2 A on the DP832 CH1 and CH2, for example. The DP831 CH3 is negative, so its voltage runs from -30 V to 0 V. The DP811 and DP813 have two ranges, chosen with :OUTP:RANG, and the limits here take the larger voltage and the larger current of the two. The guide gives the settable values of the active range only. OVP and OCP are off by default, so enable them with the OVP and OCP switches here or on the front panel before relying on the trip flags. The OVP and OCP levels take the settable ranges of Table 2-2 with 0.01 as the smallest level, because the A models accept 1 mV and the others 10 mV. The models without the A suffix list 2 decimal places unless the high resolution option is installed, and this profile sends 3. Remote sense is read where the channel has the Sense function; the guide says other channels reply NONE, so they are not recorded. SYST:REMOTE leaves only the output key of each channel, the power switch and Back usable on the front panel, and SYST:LOCAL returns control. The guide says commands sent over RS232 end with CR LF, and this profile sends a newline, so set the write terminator in the config for an RS232 link. The programming guide does not name the LAN socket port; a DP832 answers on 5555. Owners report that DP832 firmware 00.01.13.00.01 does not trip OCP on CH3, and 00.01.14.00.03 fixes it."

[evidence]
badge = "manual"
source = "RIGOL DP800 Series Programmable Linear DC Power Supply Programming Guide, PGH03109-1110, Jun. 2021, software version 00.01.17"
url = "https://www.rigol.com/dam/global/downloads/brochures/en/program-guide/dc-powers/DP800_ProgrammingGuide_EN.pdf"
date = "2026-10-21"

[match]
manufacturer = '(?i)^rigol'
model = '^DP8(11|13|21|22|31|32)A?$'
channels = 1

[[match.models]]
model = '^DP82'
channels = 2

[[match.models]]
model = '^DP83'
channels = 3

[link]
lan_port = 5555
baud = 9600
remote = "SYST:REMOTE"
local = "SYST:LOCAL"
locks_panel = true

[errors]
query = "SYST:ERR?"

# Programming Guide Table 2-1 (voltage and current) and Table 2-2 (OVP and OCP), rated channel values
[ranges]
voltage = { min = 0, max = 30, digits = 3 }
current = { min = 0, max = 3, digits = 3 }
ovp = { min = 0.01, max = 33, digits = 3 }
ocp = { min = 0.01, max = 3.3, digits = 3 }

[[ranges.models]]
model = '^DP832'
channel = 3
voltage = { min = 0, max = 5, digits = 3 }
ovp = { min = 0.01, max = 5.5, digits = 3 }

[[ranges.models]]
model = '^DP831'
channel = 1
voltage = { min = 0, max = 8, digits = 3 }
current = { min = 0, max = 5, digits = 3 }
ovp = { min = 0.01, max = 8.8, digits = 3 }
ocp = { min = 0.01, max = 5.5, digits = 3 }

[[ranges.models]]
model = '^DP831'
channel = 2
current = { min = 0, max = 2, digits = 3 }
ocp = { min = 0.01, max = 2.2, digits = 3 }

[[ranges.models]]
model = '^DP831'
channel = 3
voltage = { min = -30, max = 0, digits = 3 }
current = { min = 0, max = 2, digits = 3 }
ovp = { min = -33, max = -0.01, digits = 3 }
ocp = { min = 0.01, max = 2.2, digits = 3 }

[[ranges.models]]
model = '^DP822'
channel = 1
voltage = { min = 0, max = 20, digits = 3 }
current = { min = 0, max = 5, digits = 3 }
ovp = { min = 0.01, max = 22, digits = 3 }
ocp = { min = 0.01, max = 5.5, digits = 3 }

[[ranges.models]]
model = '^DP822'
channel = 2
voltage = { min = 0, max = 5, digits = 3 }
current = { min = 0, max = 16, digits = 3 }
ovp = { min = 0.01, max = 5.5, digits = 3 }
ocp = { min = 0.01, max = 16.8, digits = 3 }

[[ranges.models]]
model = '^DP821'
channel = 1
voltage = { min = 0, max = 60, digits = 3 }
current = { min = 0, max = 1, digits = 3 }
ovp = { min = 0.01, max = 66, digits = 3 }
ocp = { min = 0.01, max = 1.1, digits = 3 }

[[ranges.models]]
model = '^DP821'
channel = 2
voltage = { min = 0, max = 8, digits = 3 }
current = { min = 0, max = 10, digits = 3 }
ovp = { min = 0.01, max = 8.8, digits = 3 }
ocp = { min = 0.01, max = 11, digits = 3 }

[[ranges.models]]
model = '^DP813'
voltage = { min = 0, max = 20, digits = 3 }
current = { min = 0, max = 20, digits = 3 }
ovp = { min = 0.01, max = 22, digits = 3 }
ocp = { min = 0.01, max = 22, digits = 3 }

[[ranges.models]]
model = '^DP811'
voltage = { min = 0, max = 40, digits = 3 }
current = { min = 0, max = 10, digits = 3 }
ovp = { min = 0.01, max = 44, digits = 3 }
ocp = { min = 0.01, max = 11, digits = 3 }

[signals.measure]
query = ":MEAS:ALL? CH{ch}"
parse = "floats"
fields = ["voltage", "current", "power"]

[state.voltage_set]
query = ":SOUR{ch}:VOLT?"
parse = "float"

[state.current_set]
query = ":SOUR{ch}:CURR?"
parse = "float"

[state.ovp_set]
query = ":OUTP:OVP:VAL? CH{ch}"
parse = "float"

[state.ocp_set]
query = ":OUTP:OCP:VAL? CH{ch}"
parse = "float"

[state.ovp_on]
query = ":OUTP:OVP? CH{ch}"
parse = "bool"

[state.ocp_on]
query = ":OUTP:OCP? CH{ch}"
parse = "bool"

[state.remote_sense]
query = ":OUTP:SENS? CH{ch}"
parse = "bool"
optional = true

[state.output]
query = ":OUTP? CH{ch}"
parse = "bool"

[state.mode]
query = ":OUTP:MODE? CH{ch}"
parse = "map"
map = { CV = "cv", CC = "cc", UR = "unregulated" }

[state.protection]
flags = [
  { query = ":OUTP:OVP:QUES? CH{ch}", parse = "bool", value = "ovp" },
  { query = ":OUTP:OCP:QUES? CH{ch}", parse = "bool", value = "ocp" },
]

[setters.voltage]
command = ":SOUR{ch}:VOLT {value}"

[setters.current]
command = ":SOUR{ch}:CURR {value}"

[setters.ovp]
command = ":OUTP:OVP:VAL CH{ch},{value}"

[setters.ocp]
command = ":OUTP:OCP:VAL CH{ch},{value}"

[setters.ovp_on]
command = ":OUTP:OVP CH{ch},{on}"

[setters.ocp_on]
command = ":OUTP:OCP CH{ch},{on}"

[setters.output]
command = ":OUTP CH{ch},{on}"

[setters.clear]
command = [":OUTP:OCP:CLEAR CH{ch}", ":OUTP:OVP:CLEAR CH{ch}"]
