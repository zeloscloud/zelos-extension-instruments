schema = 1
id = "itech-it6100b"
name = "ITECH IT6100B series"
category = "psu"
notes = """Covers the IT6121B, IT6122B, IT6123B, IT6132B, IT6133B and IT6162B with ratings from the IT6100B data sheet and user's manual. The IT6164B has two ranges (30 V with 40 A, 60 V with 20 A), so it matches but has no range row and setpoints refuse until the config names a limit. \
The interfaces are RS-232, USB (USBTMC) and GPIB; there is no LAN port. \
RS-232 defaults to 9600 baud, 8 data bits, no parity, 1 stop bit, and the manual lets the front panel choose the baud rate and parity (Shift + I-set). \
SYST:REM sets remote control mode; the manual says RWLock disables the LOCAL key and does not say that plain remote mode locks the other keys, so locks_panel is set to be safe. \
Mode reads CV (bit 2) and CC (bit 3) of the operation condition register. \
Protection reads OV and OT from the questionable condition register. The manual gives no OCP. \
VOLT:PROT is the overvoltage level; the extension bounds it by the voltage range. \
Clear is not wired: the manual lists no protection clear command. \
The IDN reply is ITECH, <model>, <serial>, <firmware>; the manual's example is ITECH,6152,000004,V1.01 with no IT prefix on the model, so the match accepts the model with or without IT and B. \
The overvoltage protection state (VOLT:PROT:STAT, off after reset) and remote sense (SYST:SENS, off after reset) have readers, and the protection state has a setter. \
*SAV and *RCL take locations 1 to 50. \
The manual has no *TST?, beep or display command, so the self-test is off. \
Lock sends SYST:RWL, which disables the Local key, and Unlock sends SYST:REM. \
Remote sense is switched with SYST:SENS."""

[evidence]
badge = "manual"
source = "IT6100B Series SCPI Programming Guide, Ver2.0, March 2016 (IT6100-508); IT6100B data sheet and IT6100B Series User's Manual (ratings)"
url = "https://assets.testequity.com/te1/Documents/pdf/itech/ITECH_IT6100B-Programming-Guide-EN.pdf"
date = "2026-10-22"

[match]
manufacturer = '(?i)^itech'
model = '(?i)^(?:IT)?61\d\dB?$'
channels = 1

[link]
remote = "SYST:REM"
local = "SYST:LOC"
locks_panel = true

[errors]
query = "SYST:ERR?"

[[ranges.models]]
model = '(?i)^(?:IT)?6121'
voltage = { min = 0, max = 20, digits = 3 }
current = { min = 0, max = 5, digits = 4 }

[[ranges.models]]
model = '(?i)^(?:IT)?6122'
voltage = { min = 0, max = 32, digits = 3 }
current = { min = 0, max = 3, digits = 4 }

[[ranges.models]]
model = '(?i)^(?:IT)?6123'
voltage = { min = 0, max = 72, digits = 3 }
current = { min = 0, max = 1.2, digits = 4 }

[[ranges.models]]
model = '(?i)^(?:IT)?6162'
voltage = { min = 0, max = 20, digits = 3 }
current = { min = 0, max = 50, digits = 3 }

[[ranges.models]]
model = '(?i)^(?:IT)?6132'
voltage = { min = 0, max = 30, digits = 3 }
current = { min = 0, max = 5, digits = 4 }

[[ranges.models]]
model = '(?i)^(?:IT)?6133'
voltage = { min = 0, max = 60, digits = 3 }
current = { min = 0, max = 2.5, digits = 4 }

[signals.voltage]
query = "MEAS:VOLT?"
parse = "float"

[signals.current]
query = "MEAS:CURR?"
parse = "float"

[signals.power]
query = "MEAS:POW?"
parse = "float"

[state.voltage_set]
query = "VOLT?"
parse = "float"

[state.current_set]
query = "CURR?"
parse = "float"

[state.ovp_set]
query = "VOLT:PROT?"
parse = "float"

[state.ovp_on]
query = "VOLT:PROT:STAT?"
parse = "bool"

[state.remote_sense]
query = "SYST:SENS?"
parse = "bool"

[state.output]
query = "OUTP?"
parse = "bool"

[state.mode]
query = "STAT:OPER:COND?"
parse = "bits"
mask = 12
shift = 2
map = { "0" = "off", "1" = "cv", "2" = "cc" }

[state.protection]
flags = [
  { query = "STAT:QUES:COND?", parse = "bits", mask = 1, value = "ovp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 2, value = "otp" },
]

[setters.voltage]
command = "VOLT {value}"

[setters.current]
command = "CURR {value}"

[setters.ovp]
command = "VOLT:PROT {value}"

[setters.ovp_on]
command = "VOLT:PROT:STAT {on}"

[setters.output]
command = "OUTP {bit}"

[setters.remote_sense]
command = "SYST:SENS {on}"

[system]
self_test = false
save = "*SAV {slot}"
recall = "*RCL {slot}"
slots = { min = 1, max = 50 }
lock = "SYST:RWL"
unlock = "SYST:REM"
