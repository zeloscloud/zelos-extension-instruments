schema = 1
id = "itech-it6100b"
name = "ITECH IT6100B series"
category = "psu"
notes = """Covers the IT6121B, IT6122B, IT6123B, IT6132B and IT6133B with ratings from the IT6100B data sheet; other IT61xxB models match but have no range, so setpoints refuse until the config names a limit. \
The interfaces are RS-232, USB (USBTMC) and GPIB; there is no LAN port. \
RS-232 defaults to 9600 baud, 8 data bits, no parity, 1 stop bit, and the manual lets the front panel choose the baud rate and parity (Shift + I-set). \
SYST:REM sets remote control mode; the manual says RWLock disables the LOCAL key and does not say that plain remote mode locks the other keys, so locks_panel is set to be safe. \
Mode reads CV (bit 2) and CC (bit 3) of the operation condition register. \
Protection reads OV and OT from the questionable condition register. The manual gives no OCP. \
VOLT:PROT is the overvoltage level; the extension bounds it by the voltage range. \
Clear is not wired: the manual lists no protection clear command. \
The IDN reply is ITECH, <model>, <serial>, <firmware>."""

[evidence]
badge = "manual"
source = "IT6100B Series SCPI Programming Guide, Ver2.0, March 2016 (IT6100-508); IT6100B data sheet (ratings)"
url = "https://assets.testequity.com/te1/Documents/pdf/itech/ITECH_IT6100B-Programming-Guide-EN.pdf"
date = "2026-10-20"

[match]
manufacturer = '(?i)^itech'
model = '(?i)^IT61\d\dB?$'
channels = 1

[link]
remote = "SYST:REM"
local = "SYST:LOC"
locks_panel = true

[errors]
query = "SYST:ERR?"

[[ranges.models]]
model = '(?i)^IT6121'
voltage = { min = 0, max = 20, digits = 3 }
current = { min = 0, max = 5, digits = 4 }

[[ranges.models]]
model = '(?i)^IT6122'
voltage = { min = 0, max = 32, digits = 3 }
current = { min = 0, max = 3, digits = 4 }

[[ranges.models]]
model = '(?i)^IT6123'
voltage = { min = 0, max = 72, digits = 3 }
current = { min = 0, max = 1.2, digits = 4 }

[[ranges.models]]
model = '(?i)^IT6132'
voltage = { min = 0, max = 30, digits = 3 }
current = { min = 0, max = 5, digits = 4 }

[[ranges.models]]
model = '(?i)^IT6133'
voltage = { min = 0, max = 60, digits = 3 }
current = { min = 0, max = 2.5, digits = 4 }

[signals.voltage]
query = "MEAS:VOLT?"
parse = "float"

[signals.current]
query = "MEAS:CURR?"
parse = "float"

[signals.power]
query = "MEAS:POW?"
parse = "float"

[state.voltage_set]
query = "VOLT?"
parse = "float"

[state.current_set]
query = "CURR?"
parse = "float"

[state.ovp_set]
query = "VOLT:PROT?"
parse = "float"

[state.output]
query = "OUTP?"
parse = "bool"

[state.mode]
query = "STAT:OPER:COND?"
parse = "bits"
mask = 12
shift = 2
map = { "0" = "off", "1" = "cv", "2" = "cc" }

[state.protection]
flags = [
  { query = "STAT:QUES:COND?", parse = "bits", mask = 1, value = "ovp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 2, value = "otp" },
]

[setters.voltage]
command = "VOLT {value}"

[setters.current]
command = "CURR {value}"

[setters.ovp]
command = "VOLT:PROT {value}"

[setters.output]
command = "OUTP {bit}"
