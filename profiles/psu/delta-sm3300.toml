schema = 1
id = "delta-sm3300"
name = "Delta Elektronika SM3300 series"
category = "psu"
notes = """Covers the SM3300 series over its Ethernet interface; the TCP port is fixed at 8462 and the default IP address comes from DHCP. \
Commands end with a line feed, and the manual allows the short form of each keyword (SOUR:VOL, MEAS:VOL?). \
The supply takes voltage and current settings from the programming source chosen with SYST:REM:CV and SYST:REM:CC; the profile sends both as Remote once after connecting, so the front-panel knobs stop setting the output. The manual gives no command to hand control back in one step, so the Local action is not set. \
Ranges are read from the instrument after connecting (SOUR:VOL:MAX? and SOUR:CUR:MAX?). \
Mode and protection are not read: STAT:REG:A? and STAT:REG:B? return status bit sums, and the manual shows only one example (66 for constant current with DC fail), not the bit table. \
There is no protection clear command in the manual. \
The older SM 70-45 D uses a different set of abbreviated commands and its manual was not available, so it is not matched. \
The IDN reply is DELTA ELEKTRONIKA BV,SM18-220,<serial>,<firmware>,0."""

[evidence]
badge = "manual"
source = "Delta Elektronika SM3300 Ethernet & Sequencer Programming Product Manual, firmware P0210, rev. November 2025"
url = "https://www.deltaelektronika.com/sites/default/files/2025-11/SM3300_Parser_P0210_V202511.pdf"
date = "2026-10-20"

[match]
manufacturer = '(?i)^delta\s*elektronika'
model = '(?i)^SM\d+(-AR)?-\d+$'
channels = 1

[link]
lan_port = 8462
init = ["SYST:REM:CV Remote", "SYST:REM:CC Remote"]

[errors]
query = "SYST:ERR?"

[ranges]
voltage = { min = 0, max_query = "SOUR:VOL:MAX?", digits = 4 }
current = { min = 0, max_query = "SOUR:CUR:MAX?", digits = 4 }

[signals.voltage]
query = "MEAS:VOL?"
parse = "float"

[signals.current]
query = "MEAS:CUR?"
parse = "float"

[signals.power]
query = "MEAS:POW?"
parse = "float"

[state.voltage_set]
query = "SOUR:VOL?"
parse = "float"

[state.current_set]
query = "SOUR:CUR?"
parse = "float"

[state.output]
query = "OUTP?"
parse = "bool"

[setters.voltage]
command = "SOUR:VOL {value}"

[setters.current]
command = "SOUR:CUR {value}"

[setters.output]
command = "OUTP {bit}"
