schema = 1
id = "bk-9200b"
name = "B&K Precision 9200B series"
category = "psu"
notes = """Covers the 9201B, 9202B, 9205B and 9206B, single-output multi-range supplies. \
The only interfaces are USB (USBTMC) and RS-232 at 9600 baud, 8 data bits, no parity by default; there is no LAN port. \
Send SYST:REM first: the manual warns that commands sent without it may cause unpredictable results. Remote mode locks every key except Local. \
The manual terminates commands with CR and LF. \
RS-232 has no flow control and the manual calls a delay between commands mandatory but gives no value, so delay_ms is left at 0; raise it in the config if replies are lost. \
The IDN reply has a space after each comma: B&K Precision, 9205B, <serial>, <firmware>. \
Voltage and current are independent limits; the supply caps output power at 200 W (9201B), 360 W (9202B) or 600 W (9205B, 9206B). \
Constant-voltage and constant-current mode are not read: the questionable register bits for them are documented as latched events and the manual's two bit descriptions contradict each other. \
Protection reads OVP from VOLT:PROT:TRIP? and OCP and the fan-fault over-temperature bit from the questionable condition register. \
Clear resets the OVP trip only."""

[evidence]
badge = "manual"
source = "9200B Series Multi-Range DC Power Supply User Manual (Remote Commands, chapter 5)"
url = "https://bkpmedia.s3.us-west-1.amazonaws.com/downloads/manuals/en-us/9200B_Series_manual.pdf"
date = "2026-10-20"

[match]
manufacturer = '(?i)^b&?k\s*precision'
model = '(?i)^920[1256]B$'
channels = 1

[link]
write_terminator = "\r\n"
remote = "SYST:REM"
local = "SYST:LOC"
locks_panel = true

[errors]
query = "SYST:ERR?"

[ranges]
voltage = { min = 0, max = 60, digits = 3 }
current = { min = 0, max = 10, digits = 3 }

[[ranges.models]]
model = '(?i)^9202B$'
current = { min = 0, max = 15, digits = 3 }

[[ranges.models]]
model = '(?i)^9205B$'
current = { min = 0, max = 25, digits = 3 }

[[ranges.models]]
model = '(?i)^9206B$'
voltage = { min = 0, max = 150, digits = 3 }

[signals.voltage]
query = "MEAS:VOLT?"
parse = "float"

[signals.current]
query = "MEAS:CURR?"
parse = "float"

[signals.power]
query = "MEAS:POW?"
parse = "float"

[state.voltage_set]
query = "VOLT?"
parse = "float"

[state.current_set]
query = "CURR?"
parse = "float"

[state.ovp_set]
query = "VOLT:PROT?"
parse = "float"

[state.ocp_set]
query = "CURR:PROT?"
parse = "float"

[state.output]
query = "OUTP?"
parse = "bool"

[state.protection]
flags = [
  { query = "VOLT:PROT:TRIP?", parse = "bool", value = "ovp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 1024, value = "ocp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 16, value = "otp" },
]

[setters.voltage]
command = "VOLT {value}"

[setters.current]
command = "CURR {value}"

[setters.ovp]
command = "VOLT:PROT {value}"

[setters.ocp]
command = "CURR:PROT {value}"

[setters.output]
command = "OUTP {bit}"

[setters.clear]
command = "VOLT:PROT:CLE"
