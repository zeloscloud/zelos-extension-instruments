schema = 1
id = "keithley-2280s"
name = "Keithley 2280S precision DC power supply"
category = "psu"
notes = """Source and measure commands follow the Series 2280 Reference Manual. \
The manual lists no power measurement, so power is not read. \
A MEAS query switches the instrument's measurement function and enters single-measurement mode, so the extension's polling changes what the front panel shows. \
Real units answer :MEAS:VOLT? with the current, the voltage and a relative time, each with its unit letter, as the default :FORMat:ELEMents list gives, so one query reads both. \
The raw socket port is 5025 from firmware 1.06 and 5050 before; one manual page says 1.06 and earlier use 5050, another says 1.05 and earlier. \
Remote operation locks every front-panel key except LOCAL and OUTPUT until the Local action runs. \
CURR sets the current limit of the voltage source. \
The OVP level accepts 0.5 V to 33 V (2280S-32-6) or 61 V (2280S-60-3), and the OCP level 0.1 A to 6.1 A or 3.3 A; the ranges below carry those limits. \
Mode reads constant current (bit 0) and constant voltage (bit 1) from the Questionable Instrument Summary condition register; it reads off when neither bit is set, which the manual does not say means the output is off. \
The 2281S battery simulator is not covered. \
The output query can also return DISable (2), which reads as an error. \
*SAV and *RCL take locations 1 to 5. \
The manual says *TST? returns 0 and runs no self-test. \
:DISP:USER:TEXT shows up to 24 characters on the output screen, only while the instrument is in remote operation, and :DISP:CLE clears them. \
Lock sends :SYST:RWL and Unlock sends :SYST:LOC. \
The manual's beeper command covers errors only, so there is no beep action. \
The manual has no remote-sense, OVP delay or tracking command."""

[evidence]
badge = "manual"
source = "Series 2280 Precision Measurement DC Power Supplies Reference Manual, 077085503, March 2019"
url = "https://download.tek.com/manual/077085503_2280_Ref_Mar_20191.pdf"
date = "2026-10-22"

[match]
manufacturer = '(?i)^keithley'
model = '(?i)^(MODEL ?)?2280S-(32-6|60-3)$'
channels = 1

[link]
lan_port = 5025
local = "SYST:LOC"
locks_panel = true

[errors]
query = ":SYST:ERR?"

[ranges]
voltage = { min = 0, max = 32, digits = 3 }
current = { min = 0, max = 6.1, digits = 3 }
ovp = { min = 0.5, max = 33, digits = 3 }
ocp = { min = 0.1, max = 6.1, digits = 3 }

[[ranges.models]]
model = '2280S-60-3$'
voltage = { min = 0, max = 60, digits = 3 }
current = { min = 0, max = 3.3, digits = 3 }
ovp = { min = 0.5, max = 61, digits = 3 }
ocp = { min = 0.1, max = 3.3, digits = 3 }

[signals.measure]
query = ":MEAS:VOLT?"
parse = "floats"
fields = ["current", "voltage"]

[state.voltage_set]
query = ":SOUR:VOLT?"
parse = "float"

[state.current_set]
query = ":SOUR:CURR?"
parse = "float"

[state.ovp_set]
query = ":SOUR:VOLT:PROT?"
parse = "float"

[state.ocp_set]
query = ":SOUR:CURR:PROT?"
parse = "float"

[state.output]
query = ":OUTP?"
parse = "bool"

[state.mode]
query = ":STAT:QUES:INST:ISUM:COND?"
parse = "bits"
mask = 3
map = { "0" = "off", "1" = "cc", "2" = "cv" }

[state.protection]
query = ":OUTP:PROT:TRIP?"
parse = "map"
map = { NONE = "none", OVP = "ovp", OCP = "ocp", OTP = "otp", RVS = "other", OPS = "other" }

[setters.voltage]
command = ":SOUR:VOLT {value}"

[setters.current]
command = ":SOUR:CURR {value}"

[setters.ovp]
command = ":SOUR:VOLT:PROT {value}"

[setters.ocp]
command = ":SOUR:CURR:PROT {value}"

[setters.output]
command = ":OUTP {bit}"

[setters.clear]
command = ":OUTP:PROT:CLE"

[system]
save = "*SAV {slot}"
recall = "*RCL {slot}"
slots = { min = 1, max = 5 }
display_text = ':DISP:USER:TEXT "{text}"'
display_text_max = 24
display_clear = ":DISP:CLE"
lock = ":SYST:RWL"
unlock = ":SYST:LOC"
