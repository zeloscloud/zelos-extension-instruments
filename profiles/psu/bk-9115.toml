schema = 1
id = "bk-9115"
name = "B&K Precision 9115 and 9116 series"
category = "psu"
notes = """Covers the 9115, 9115B, 9115B-AT (80 V at 60 A) and the 9116, 9116B (150 V at 30 A), single-output multi-range supplies. \
Interfaces are USB (USBTMC), RS-232 and RS-485, with GPIB optional; LAN exists on the 9117 only, which this profile does not cover. \
The RS-232 default is 4800 baud, 8 data bits, no parity, 1 stop bit, address 0, and the manual warns that 115200 baud may be unstable. \
The manual terminates commands with CR and LF. \
SYST:REM switches to remote control and the Local key stays active; SYST:LOC returns to the front panel. \
Voltage and current are independent limits within the rated power, so a setpoint pair can be refused. \
Mode reads CV and CC from the operation condition register (bit 4 and bit 5). \
Protection reads OV, OC, OP and OT from the questionable condition register. \
The manual documents no OCP level command, so the OCP setter is omitted. \
Clear resets the OVP trip only. \
The automotive test functions of the 9115B-AT are not covered."""

[evidence]
badge = "manual"
source = "9115 Multi-Range DC Power Supply Programming Manual; 9115 Series user manual (interfaces, ratings)"
url = "https://bkpmedia.s3.us-west-1.amazonaws.com/downloads/programming_manuals/en-us/9115_Series_programming_manual.pdf"
date = "2026-10-20"

[match]
manufacturer = '(?i)^b&?k\s*precision'
model = '(?i)^911[56]B?(-AT)?$'
channels = 1

[link]
write_terminator = "\r\n"
baud = 4800
remote = "SYST:REM"
local = "SYST:LOC"
locks_panel = true

[errors]
query = "SYST:ERR?"

[ranges]
voltage = { min = 0, max = 80, digits = 3 }
current = { min = 0, max = 60, digits = 3 }

[[ranges.models]]
model = '(?i)^9116'
voltage = { min = 0, max = 150, digits = 3 }
current = { min = 0, max = 30, digits = 3 }

[signals.voltage]
query = "MEAS:VOLT?"
parse = "float"

[signals.current]
query = "MEAS:CURR?"
parse = "float"

[signals.power]
query = "MEAS:POW?"
parse = "float"

[state.voltage_set]
query = "VOLT?"
parse = "float"

[state.current_set]
query = "CURR?"
parse = "float"

[state.ovp_set]
query = "VOLT:PROT?"
parse = "float"

[state.output]
query = "OUTP?"
parse = "bool"

[state.mode]
query = "STAT:OPER:COND?"
parse = "bits"
mask = 48
shift = 4
map = { "0" = "off", "1" = "cv", "2" = "cc" }

[state.protection]
flags = [
  { query = "STAT:QUES:COND?", parse = "bits", mask = 1, value = "ovp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 2, value = "ocp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 8, value = "opp" },
  { query = "STAT:QUES:COND?", parse = "bits", mask = 16, value = "otp" },
]

[setters.voltage]
command = "VOLT {value}"

[setters.current]
command = "CURR {value}"

[setters.ovp]
command = "VOLT:PROT {value}"

[setters.output]
command = "OUTP {bit}"

[setters.clear]
command = "PROT:CLE"
