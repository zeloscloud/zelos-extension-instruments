schema = 1
id = "rohde-schwarz-ngp800"
name = "Rohde & Schwarz NGP800 series"
category = "psu"
notes = """Covers the NGP802, NGP822 (two channels) and the NGP804, NGP824, NGP814 (four channels). \
The NGP802, NGP804 and channels 1 and 2 of the NGP814 are 32 V at 20 A; the NGP822, NGP824 and channels 3 and 4 of the NGP814 are 64 V at 10 A. Each channel is limited to 200 W. \
Channel commands act on the channel chosen with INST:NSEL, so the extension selects before every query and set. \
SYST:REM locks the front panel; the Local action (SYST:LOC) unlocks it. \
A channel delivers power only while its channel key (OUTP:SEL) and the primary output (OUTP:GEN, the Output key) are both on, and the primary output switches every selected channel at once. \
A real NGP814 was found with all four channel keys on and the primary output off, and on a bench NGE100 OUTP ON switched the primary output on and with it every other selected channel. \
So switching a channel on sends OUTP:SEL 1, then OUTP:GEN 1 if the primary output is off. \
If another channel's key is on while the primary output is off, switching a channel on is refused before anything is sent, because the primary output would switch that channel on too. \
Switching a channel off sends OUTP:SEL 0 and leaves the primary output alone. \
Output reads OUTP?, and what it answers while a channel is selected and the primary output is off was not seen on a unit. \
Mode reads the questionable condition register of the channel: bit 0 is constant current and bit 1 is constant voltage; zero is shown as off, which the manual does not state. \
Protection reads OVP, fuse (OCP), OPP and over-temperature. The OVP, fuse (OCP) and OPP functions each have an on/off state; the OVP and OCP states are read and switched, the OPP state is not. \
Clear resets the OVP, OCP (FUSE:TRIP:CLEar) and OPP trips of the selected channel. \
The manual lists no OCP level command, so the OCP setter is omitted. \
Remote sense is read and set with VOLT:SENS, which takes and answers INT or EXT for the selected channel. Tracking, where channels follow each other's setpoints, is not a series or parallel mode, so it is not read. \
The LAN socket port is fixed at 5025. The *TST? self-test returns an error code, and 0 means no error. Save and recall use the ten memories 0 to 9. The manual has no general beep command, so Beep sends the single error and warning beep (SYST:BEEP:WARN). Lock sends SYST:RWL, which shows a message box and locks the front panel until Unlock (SYST:LOC). The Display action clears the text message box; the manual gives no length limit for DISP:TEXT, so there is no action to show a message. The manual documents no restart command."""

[evidence]
badge = "manual"
source = "R&S NGP800 Power Supply Series User Manual, 5601.5610.02, Version 14, firmware 2.025 or higher"
url = "https://scdn.rohde-schwarz.com/ur/pws/dl_downloads/pdm/cl_manuals/user_manual/5601_5610_01/NGP800_User_Manual_en_14.pdf"
date = "2026-10-22"

[match]
manufacturer = '(?i)^rohde\s*&\s*schwarz'
model = '(?i)^NGP8(02|04|14|22|24)$'
channels = 4

[[match.models]]
model = '(?i)^NGP8(02|22)$'
channels = 2

[link]
select = "INST:NSEL {ch}"
remote = "SYST:REM"
local = "SYST:LOC"
locks_panel = true

[errors]
query = "SYST:ERR?"

[system]
save = "*SAV {slot}"
recall = "*RCL {slot}"
slots = { min = 0, max = 9 }
beep = "SYST:BEEP:WARN"
display_clear = "DISP:TEXT:CLE"
lock = "SYST:RWL"
unlock = "SYSTem:LOCal"

[ranges]
voltage = { min = 0, max = 32.05, digits = 3 }
current = { min = 0.001, max = 20.01, digits = 3 }

[[ranges.models]]
model = '(?i)^NGP814$'
channel = 3
voltage = { min = 0, max = 64.05, digits = 3 }
current = { min = 0.001, max = 10.01, digits = 3 }

[[ranges.models]]
model = '(?i)^NGP814$'
channel = 4
voltage = { min = 0, max = 64.05, digits = 3 }
current = { min = 0.001, max = 10.01, digits = 3 }

[[ranges.models]]
model = '(?i)^NGP82[24]$'
voltage = { min = 0, max = 64.05, digits = 3 }
current = { min = 0.001, max = 10.01, digits = 3 }

[signals.voltage]
query = "MEAS:VOLT?"
parse = "float"

[signals.current]
query = "MEAS:CURR?"
parse = "float"

[signals.power]
query = "MEAS:POW?"
parse = "float"

[state.voltage_set]
query = "VOLT?"
parse = "float"

[state.current_set]
query = "CURR?"
parse = "float"

[state.ovp_set]
query = "VOLT:PROT:LEV?"
parse = "float"

[state.ovp_on]
query = "VOLT:PROT?"
parse = "bool"

[state.ocp_on]
query = "FUSE?"
parse = "bool"

[state.remote_sense]
query = "VOLT:SENS?"
parse = "bool"
map = { INT = "off", EXT = "on" }

[state.output]
query = "OUTP?"
parse = "bool"

[state.mode]
query = "STAT:QUES:INST:ISUM{ch}:COND?"
parse = "bits"
mask = 3
map = { "0" = "off", "1" = "cc", "2" = "cv" }

[state.protection]
flags = [
  { query = "VOLT:PROT:TRIP?", parse = "bool", value = "ovp" },
  { query = "FUSE:TRIP?", parse = "bool", value = "ocp" },
  { query = "POW:PROT:TRIP?", parse = "bool", value = "opp" },
  { query = "STAT:QUES:INST:ISUM{ch}:COND?", parse = "bits", mask = 16, value = "otp" },
]

[setters.voltage]
command = "VOLT {value}"

[setters.current]
command = "CURR {value}"

[setters.ovp]
command = "VOLT:PROT:LEV {value}"

[setters.ovp_on]
command = "VOLT:PROT {bit}"

[setters.ocp_on]
command = "FUSE {bit}"

[setters.output]
command = "OUTP:SEL {bit}"
master = { command = "OUTP:GEN {bit}", query = "OUTP:GEN?", armed = "OUTP:SEL?" }

[setters.remote_sense]
command = "VOLT:SENS EXT"
off = "VOLT:SENS INT"

[setters.clear]
command = ["VOLT:PROT:CLE", "FUSE:TRIP:CLE", "POW:PROT:CLE"]
