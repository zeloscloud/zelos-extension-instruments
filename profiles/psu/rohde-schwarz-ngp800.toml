schema = 1
id = "rohde-schwarz-ngp800"
name = "Rohde & Schwarz NGP800 series"
category = "psu"
notes = """Covers the NGP802, NGP822 (two channels) and the NGP804, NGP824, NGP814 (four channels). \
The NGP802, NGP804 and channels 1 and 2 of the NGP814 are 32 V at 20 A; the NGP822, NGP824 and channels 3 and 4 of the NGP814 are 64 V at 10 A. Each channel is limited to 200 W. \
Channel commands act on the channel chosen with INST:NSEL, so the extension selects before every query and set. \
SYST:REM locks the front panel; the Local action (SYST:LOC) unlocks it. \
OUTP switches the selected channel on and turns its output on; OUTP:SEL (channel key) and OUTP:GEN (primary output key) are not used. \
Mode reads the questionable condition register of the channel: bit 0 is constant current and bit 1 is constant voltage; zero is shown as off, which the manual does not state. \
Protection reads OVP, fuse (OCP), OPP and over-temperature. The OVP, fuse (OCP) and OPP functions each have an on/off state; the OVP and OCP states are read and switched, the OPP state is not. \
Clear resets the OVP, OCP (FUSE:TRIP:CLEar) and OPP trips of the selected channel. \
The manual lists no OCP level command, so the OCP setter is omitted. \
Remote sense answers INT or EXT and tracking is enabled per channel; the profile reads neither. \
The LAN socket port is fixed at 5025."""

[evidence]
badge = "manual"
source = "R&S NGP800 Power Supply Series User Manual, 5601.5610.02, Version 14, firmware 2.025 or higher"
url = "https://scdn.rohde-schwarz.com/ur/pws/dl_downloads/pdm/cl_manuals/user_manual/5601_5610_01/NGP800_User_Manual_en_14.pdf"
date = "2026-10-21"

[match]
manufacturer = '(?i)^rohde\s*&\s*schwarz'
model = '(?i)^NGP8(02|04|14|22|24)$'
channels = 4

[[match.models]]
model = '(?i)^NGP8(02|22)$'
channels = 2

[link]
select = "INST:NSEL {ch}"
remote = "SYST:REM"
local = "SYST:LOC"
locks_panel = true

[errors]
query = "SYST:ERR?"

[ranges]
voltage = { min = 0, max = 32.05, digits = 3 }
current = { min = 0.001, max = 20.01, digits = 3 }

[[ranges.models]]
model = '(?i)^NGP814$'
channel = 3
voltage = { min = 0, max = 64.05, digits = 3 }
current = { min = 0.001, max = 10.01, digits = 3 }

[[ranges.models]]
model = '(?i)^NGP814$'
channel = 4
voltage = { min = 0, max = 64.05, digits = 3 }
current = { min = 0.001, max = 10.01, digits = 3 }

[[ranges.models]]
model = '(?i)^NGP82[24]$'
voltage = { min = 0, max = 64.05, digits = 3 }
current = { min = 0.001, max = 10.01, digits = 3 }

[signals.voltage]
query = "MEAS:VOLT?"
parse = "float"

[signals.current]
query = "MEAS:CURR?"
parse = "float"

[signals.power]
query = "MEAS:POW?"
parse = "float"

[state.voltage_set]
query = "VOLT?"
parse = "float"

[state.current_set]
query = "CURR?"
parse = "float"

[state.ovp_set]
query = "VOLT:PROT:LEV?"
parse = "float"

[state.ovp_on]
query = "VOLT:PROT?"
parse = "bool"

[state.ocp_on]
query = "FUSE?"
parse = "bool"

[state.output]
query = "OUTP?"
parse = "bool"

[state.mode]
query = "STAT:QUES:INST:ISUM{ch}:COND?"
parse = "bits"
mask = 3
map = { "0" = "off", "1" = "cc", "2" = "cv" }

[state.protection]
flags = [
  { query = "VOLT:PROT:TRIP?", parse = "bool", value = "ovp" },
  { query = "FUSE:TRIP?", parse = "bool", value = "ocp" },
  { query = "POW:PROT:TRIP?", parse = "bool", value = "opp" },
  { query = "STAT:QUES:INST:ISUM{ch}:COND?", parse = "bits", mask = 16, value = "otp" },
]

[setters.voltage]
command = "VOLT {value}"

[setters.current]
command = "CURR {value}"

[setters.ovp]
command = "VOLT:PROT:LEV {value}"

[setters.ovp_on]
command = "VOLT:PROT {bit}"

[setters.ocp_on]
command = "FUSE {bit}"

[setters.output]
command = "OUTP {bit}"

[setters.clear]
command = ["VOLT:PROT:CLE", "FUSE:TRIP:CLE", "POW:PROT:CLE"]
