schema = 1
id = "keithley-2260b"
name = "Keithley 2260B and GW Instek / TEXIO PSW series"
category = "psu"
notes = """The Keithley 2260B and the GW Instek PSW (sold by TEXIO) share one command set; the PSW Programming Manual confirms every command used here. \
The instrument has one output and needs no remote command; the front panel stays live. \
The LAN socket server listens on port 2268 only; it needs firmware V1.12 or newer and is enabled by function F-57, which defaults to enabled. \
Setpoints accept 0 to 105 % of the rating, so the ranges below carry 105 % of the rated voltage and current. \
The OVP level accepts 0 to 110 % of the rated voltage and the OCP level 10 to 110 % of the rated current; the OVP and OCP ranges are read from the unit with the MIN and MAX queries. \
:CURR:PROT:STAT switches OCP on and off; the manual has no OVP switch. \
Mode reads CV or CC from the Operation Status condition register; it reads off when neither bit is set, which the manual does not say means the output is off. \
Protection reads the Questionable Status condition register: OV, OC and OT. Clear a trip with the Clear action. \
On four real 2260B units the Questionable Status condition register read 0 in every state seen, including constant current, and the Operation Status register was not tried, so mode and protection are unverified on a unit. \
Serial settings are not given in the manuals and are left at the defaults. \
The manual has no *SAV or *RCL entry, so save and recall are not offered. \
:DISP:TEXT:CLE clears a display message; the manual gives no text length, so showing text is not offered. \
Lock sends :SYST:KLOC ON and Unlock sends :SYST:KLOC OFF; with the keys locked, the Output key can still turn the output off unless :SYST:KEYL:MODE is changed. \
The beeper command only switches the beeper, so there is no beep action. \
The manual has no remote-sense, OVP delay or tracking command."""

[evidence]
badge = "manual"
source = "Series 2260B Programmable DC Power Supplies Programming, 077104703, October 2024; GW Instek PSW Series Programming Manual, no revision printed (transcat.com copy)"
url = "https://download.tek.com/manual/077104703_Oct2024_2260B_Programming.pdf"
date = "2026-10-22"

[match]
manufacturer = '(?i)^(keithley|gw[- ]?instek|texio)'
model = '(?i)^(MODEL ?)?(2260B-|PSW)'
channels = 1

[link]
lan_port = 2268

[errors]
query = ":SYST:ERR?"

[signals.voltage]
query = ":MEAS:VOLT?"
parse = "float"

[signals.current]
query = ":MEAS:CURR?"
parse = "float"

[signals.power]
query = ":MEAS:POW?"
parse = "float"

[state.voltage_set]
query = ":SOUR:VOLT?"
parse = "float"

[state.current_set]
query = ":SOUR:CURR?"
parse = "float"

[state.ovp_set]
query = ":SOUR:VOLT:PROT?"
parse = "float"

[state.ocp_set]
query = ":SOUR:CURR:PROT?"
parse = "float"

[state.ocp_on]
query = ":SOUR:CURR:PROT:STAT?"
parse = "bool"

[state.output]
query = ":OUTP?"
parse = "bool"

[state.mode]
query = ":STAT:OPER:COND?"
parse = "bits"
mask = 1280
shift = 8
map = { "0" = "off", "1" = "cv", "4" = "cc" }

[state.protection]
flags = [
  { query = ":STAT:QUES:COND?", parse = "bits", mask = 1, value = "ovp" },
  { query = ":STAT:QUES:COND?", parse = "bits", mask = 2, value = "ocp" },
  { query = ":STAT:QUES:COND?", parse = "bits", mask = 16, value = "otp" },
]

[setters.voltage]
command = ":SOUR:VOLT {value}"

[setters.current]
command = ":SOUR:CURR {value}"

[setters.ovp]
command = ":SOUR:VOLT:PROT {value}"

[setters.ocp]
command = ":SOUR:CURR:PROT {value}"

[setters.ocp_on]
command = ":SOUR:CURR:PROT:STAT {on}"

[setters.output]
command = ":OUTP {bit}"

[setters.clear]
command = ":OUTP:PROT:CLE"

[ranges]
ovp = { min_query = ":SOUR:VOLT:PROT? MIN", max_query = ":SOUR:VOLT:PROT? MAX", digits = 3 }
ocp = { min_query = ":SOUR:CURR:PROT? MIN", max_query = ":SOUR:CURR:PROT? MAX", digits = 3 }

