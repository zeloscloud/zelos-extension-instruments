schema = 1
id = "gw-instek-gpd"
name = "GW Instek GPD-X303S series"
category = "psu"
notes = """Covers the GPD-2303S, GPD-3303S and GPD-4303S, and the GPD-3303D, which use the vendor grammar (VSET1:5.00, ISET1:1.000, VOUT1?, IOUT1?, OUT1), not SCPI. \
Commands end with a line feed. The manual shows no reply example for the setting and readback queries; the float parser accepts a trailing unit letter. \
A real GPD-3303D ends each reply with a carriage return alone, so the profile reads to CR. \
One GPD-3303D driver reports that the unit rejects an LF-only command with Invalid Character, and another sends LF; set the write terminator to CR LF in the config if commands fail. \
The first command after the port opens can fail with Invalid Character while stale bytes sit in the unit's buffer; reconnect if identification fails. \
A real GPD-3303D reads setpoints back to 0.1 V and 0.01 A, so its settings are sent with one and two decimals. \
Every command lists a response time of at least 10 ms, with longer times expected at 9600 or 57600 baud, so the profile waits 10 ms between commands. \
USB only: a virtual COM port at 9600 baud by default (the BAUD command switches to 57600 or 115200), 8 data bits, no parity, 1 stop bit, no flow control. \
Connecting over USB locks the front panel; the LOCAL command, the Lock key or unplugging the cable restores it. \
OUT1 and OUT0 switch every output together; the manual has no per-channel output command. \
The output state and the constant-voltage and constant-current flags exist only in the STATUS? reply, which the manual describes as 8 bits and does not show as text, so they are not read and the output setter is not verified. \
In tracking mode (TRACK1 or TRACK2) the instrument refuses setting CH2 and reports a command-not-allowed error; the profile does not read the mode. \
The 3303S channel 3 is a fixed 2.5 V, 3.3 V or 5 V output chosen on the front panel, and the manual lists no remote channel number for it, so the 3303S is limited to channels 1 and 2. \
The 4303S channel 3 is 0 to 5 V at 3 A or 5.001 to 10 V at 1 A, and channel 4 is 5 V at 1 A; the range below carries 10 V and 3 A, so the instrument refuses 3 A above 5 V. \
Setpoints in the manual are 0 to 32 V and 0 to 3.2 A on channels 1 and 2. \
ERR? answers No Error. when clear and returns the last complaint once, such as Data out of range., on a real GPD-3303D, so the profile reads it. \
Power is not measured by any command. \
The manual shows the IDN reply as GW INSTEK, GPD-x303S, SN: xxxxxxxx, Vx.xx, with a placeholder model name."""

[evidence]
badge = "manual"
source = "GPD-X303S Series User Manual, GW Instek part no. 82PD-433S0MC1 (Remote Control chapter); the text prints no version or date"
url = "https://www.gwinstek.com/en-global/products/downloadSeriesDownNew/7837/1474"
date = "2026-10-21"

[match]
manufacturer = '(?i)^gw[- ]?instek'
model = '(?i)^GPD-?(2303S|3303S|3303D|4303S)$'
channels = 2

[[match.models]]
model = '(?i)^GPD-?4303S$'
channels = 4

[link]
baud = 9600
read_terminator = "\r"
delay_ms = 10
local = "LOCAL"
locks_panel = true

[errors]
query = "ERR?"
ok = '(?i)no error'

[ranges]
voltage = { min = 0, max = 32, digits = 3 }
current = { min = 0, max = 3.2, digits = 3 }

[[ranges.models]]
model = '(?i)^GPD-?3303D$'
voltage = { min = 0, max = 32, digits = 1 }
current = { min = 0, max = 3.2, digits = 2 }

[[ranges.models]]
model = '(?i)^GPD-?4303S$'
channel = 3
voltage = { min = 0, max = 10, digits = 3 }
current = { min = 0, max = 3, digits = 3 }

[[ranges.models]]
model = '(?i)^GPD-?4303S$'
channel = 4
voltage = { min = 0, max = 5, digits = 3 }
current = { min = 0, max = 1, digits = 3 }

[signals.voltage]
query = "VOUT{ch}?"
parse = "float"

[signals.current]
query = "IOUT{ch}?"
parse = "float"

[state.voltage_set]
query = "VSET{ch}?"
parse = "float"

[state.current_set]
query = "ISET{ch}?"
parse = "float"

[setters.voltage]
command = "VSET{ch}:{value}"

[setters.current]
command = "ISET{ch}:{value}"

[setters.output]
command = "OUT{bit}"
channel = false
